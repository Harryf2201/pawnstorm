<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawnstorm Lab</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c222c; --border: #2a313c;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --good: #3fb950; --bad: #f85149; --warn: #d29922;
    --sq-light: #e8dcc0; --sq-dark: #a7825a; --hl: rgba(255, 214, 10, .45);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 24px; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  #updated { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  h2 { font-size: 13px; margin: 36px 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .8px; }
  .sub { color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
  .pos { color: var(--good); } .neg { color: var(--bad); }

  /* Rating hero */
  .hero { display: grid; grid-template-columns: minmax(280px, 1fr) 2fr; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .rating-label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .6px; }
  .rating { font-size: 64px; font-weight: 800; line-height: 1.05; margin: 6px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .rating small { font-size: 22px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .delta { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; color: var(--good); font-size: 12px; font-weight: 600; background: rgba(63,185,80,.12); border: 1px solid rgba(63,185,80,.35); padding: 2px 10px; border-radius: 999px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .fact .k { color: var(--muted); font-size: 12px; } .fact .v { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .chart svg { width: 100%; height: 300px; display: block; }
  .chart.small svg { height: 200px; }

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.running { background: var(--good); box-shadow: 0 0 0 3px rgba(63,185,80,.2); animation: pulse 1.6s infinite; }
  .dot.finished { background: var(--accent); } .dot.stopped { background: var(--muted); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(63,185,80,0); } }

  /* Tournament panels */
  .run { margin-bottom: 18px; }
  .run h3 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 14px; }
  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .card .v { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .5s; }
  .llr { position: relative; height: 10px; margin-top: 12px; border-radius: 5px; background: linear-gradient(90deg, rgba(248,81,73,.35), var(--bg) 50%, rgba(63,185,80,.35)); }
  .llr .m { position: absolute; top: -3px; width: 4px; height: 16px; border-radius: 2px; background: var(--text); transform: translateX(-2px); }
  .run h4 { font-size: 12px; margin: 22px 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  .tbl { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  .runs-table tr.row { cursor: pointer; } .runs-table tr.row:hover td { background: var(--panel2); }
  .runs-table td.detail { padding: 0 12px 16px; background: var(--panel); }

  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .game { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .player { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 4px 2px; gap: 8px; }
  .player .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .player .c { font-variant-numeric: tabular-nums; background: var(--bg); padding: 1px 6px; border-radius: 4px; }
  .player.to .c { background: var(--accent); color: #0b1220; font-weight: 700; }
  .bw { display: flex; gap: 6px; }
  .evalbar { width: 10px; border-radius: 3px; overflow: hidden; background: #333; display: flex; flex-direction: column; }
  .evalbar .b { background: #2b2b2b; transition: height .4s; } .evalbar .w { background: #f0f0f0; flex: 1; }
  .board { flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; border-radius: 4px; overflow: hidden; container-type: inline-size; }
  .sq { display: flex; align-items: center; justify-content: center; position: relative; }
  .sq.l { background: var(--sq-light); } .sq.d { background: var(--sq-dark); }
  .sq.hl::after { content: ""; position: absolute; inset: 0; background: var(--hl); }
  .pc { font-family: "Segoe UI Symbol", "DejaVu Sans", serif; font-size: 10.5cqw; line-height: 1; position: relative; z-index: 1; }
  .pc.w { color: #fff; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 0 1px #000, 0 1px 2px rgba(0,0,0,.5); }
  .pc.b { color: #161616; text-shadow: 0 0 1px rgba(255,255,255,.4); }
  .ginfo { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .ginfo b { color: var(--text); }
  .empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }
  .warnbox { background: rgba(210,153,34,.1); border: 1px solid rgba(210,153,34,.4); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
  .res-w { color: var(--good); font-weight: 700; } .res-l { color: var(--bad); font-weight: 700; } .res-d { color: var(--muted); font-weight: 700; }
  nav button { background: none; border: 0; color: var(--muted); font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  nav button.active { background: var(--panel2); color: var(--text); }
  .count { background: var(--accent); color: #0b1220; border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 700; margin-left: 4px; }
  .count:empty { display: none; }
  .ach-list { display: flex; flex-direction: column; gap: 8px; }
  .ach { display: flex; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
  .ach .ic { font-size: 24px; line-height: 1; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--panel2); flex: none; }
  .ach .body { flex: 1; min-width: 0; }
  .ach .t { font-weight: 700; font-size: 15px; } .ach .d { color: var(--muted); font-size: 13px; margin-top: 1px; }
  .ach .w { color: var(--muted); font-size: 12px; text-align: right; flex: none; }
  .ach.gold { border-color: rgba(227,179,65,.6); background: linear-gradient(135deg, rgba(227,179,65,.12), var(--panel) 60%); }
  .ach.gold .ic { background: rgba(227,179,65,.18); }
  .ach.silver { border-color: rgba(173,186,199,.45); } .ach.silver .ic { background: rgba(173,186,199,.12); }
  .ach.bronze .ic { background: rgba(205,127,50,.15); }
  .ach.locked { opacity: .45; } .ach.locked .ic { filter: grayscale(1); }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .rating { font-size: 48px; } main { padding: 16px; } }
</style>
</head>
<body>
<header>
  <div class="brand">♞ Pawnstorm <span>Lab</span></div>
  <nav>
    <button data-tab="dash" class="active">Dashboard</button>
    <button data-tab="ach">Achievements <span id="ach-count" class="count"></span></button>
  </nav>
  <div id="updated"></div>
</header>
<main>
  <div id="dash">
    <section id="rating"></section>
    <section id="ongoing"></section>
    <section id="finished"></section>
  </div>
  <section id="ach" hidden></section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(0);
const cls = e => e > 0 ? 'pos' : e < 0 ? 'neg' : '';
const fmtElo = (e, err) => e == null ? '–' : `${e > 0 ? '+' : ''}${e.toFixed(1)}${err != null ? ` <span class="sub" style="font-size:.65em">±${err.toFixed(1)}</span>` : ''}`;
const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const clock = ms => { const s = Math.max(0, ms) / 1000; return s >= 60 ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : s.toFixed(1); };
const when = t => { const d = new Date(t * 1000); return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); };

let runs = [], details = {}, expanded = new Set(), ach = null, tab = 'dash';

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  $('#dash').hidden = tab !== 'dash';
  $('#ach').hidden = tab !== 'ach';
  render();
});

const CATEGORIES = [
  ['rating', 'Rating milestones'],
  ['wins', 'First wins'],
  ['matches', 'Match victories'],
  ['sprt', 'Proven improvements'],
  ['games', 'Games played'],
];

function renderAchievements() {
  if (!ach) return '<div class="empty">Loading…</div>';
  const total = ach.items.length, done = ach.items.filter(a => a.unlocked).length;
  const row = a => `<div class="ach ${a.unlocked ? a.tier : 'locked'}"><div class="ic">${a.icon}</div>
    <div class="body"><div class="t">${esc(a.title)}</div><div class="d">${esc(a.desc)}</div></div>
    <div class="w">${a.unlocked ? `<span class="pos">✓ ${when(a.date)}</span><br>${esc(a.run)}` : '🔒 not yet'}</div></div>`;
  return `<div class="panel" style="display:flex;align-items:center;gap:20px;margin-top:8px">
      <div><div class="rating-label">Achievements</div><div class="rating" style="font-size:44px">${done}<small> / ${total}</small></div></div>
      <div style="flex:1"><div class="bar" style="height:10px"><div style="width:${100 * done / Math.max(1, total)}%"></div></div></div>
    </div>` +
    CATEGORIES.map(([cat, label]) => {
      const items = ach.items.filter(a => a.cat === cat).sort((a, b) => a.key - b.key);
      if (!items.length) return '';
      const n = items.filter(a => a.unlocked).length;
      return `<h2>${label} <span class="sub" style="text-transform:none;letter-spacing:0">· ${n} of ${items.length}</span></h2><div class="ach-list">${items.map(row).join('')}</div>`;
    }).join('');
}

async function poll() {
  try {
    runs = await (await fetch('/api/runs')).json();
    ach = await (await fetch('/api/achievements')).json();
    $('#ach-count').textContent = ach.items.filter(a => a.unlocked).length || '';
    const want = runs.filter(r => r.status === 'running' || expanded.has(r.id)).map(r => r.id);
    const got = await Promise.all(want.map(id => fetch('/api/run/' + encodeURIComponent(id)).then(r => r.json()).catch(() => null)));
    details = {};
    want.forEach((id, i) => { if (got[i]) details[id] = got[i]; });
    $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    render();
  } catch (e) {
    $('#updated').innerHTML = '<span class="neg">Dashboard server not reachable</span>';
  }
}

function render() {
  if (tab === 'ach') { $('#ach').innerHTML = renderAchievements(); return; }
  $('#rating').innerHTML = renderRating();
  const live = runs.filter(r => r.status === 'running');
  $('#ongoing').innerHTML = `<h2>Ongoing tournaments (${live.length})</h2>` +
    (live.length ? live.map(r => `<div class="panel run">${renderRun(details[r.id], r)}</div>`).join('') : '<div class="empty">Nothing running right now.</div>');
  const done = runs.filter(r => r.status !== 'running');
  $('#finished').innerHTML = `<h2>Finished tournaments (${done.length})</h2>` + (done.length ? `<div class="panel" style="padding:4px 0"><table class="runs-table">
    <tr><th></th><th>Test</th><th>When</th><th class="r">Games</th><th class="r">Elo vs field</th><th class="r">Rating</th><th>Outcome</th></tr>
    ${done.map(r => `<tr class="row" data-id="${esc(r.id)}"><td style="width:20px">${expanded.has(r.id) ? '▾' : '▸'}</td><td><b>${esc(r.name)}</b> <span class="pill">${esc(r.type)}</span></td>
      <td class="sub">${r.created ? when(r.created) : ''}</td><td class="r">${r.games}</td>
      <td class="r ${cls(r.elo)}">${r.elo == null ? '–' : fmtElo(r.elo, r.err)}</td>
      <td class="r">${r.perf == null ? '–' : '≈ ' + r.perf.toFixed(0) + ' <span class="sub">±' + r.perf_err.toFixed(0) + '</span>'}</td>
      <td>${r.verdict ? (r.verdict.includes('H1') ? '<span class="pos">passed</span>' : '<span class="neg">failed</span>') : esc(r.status)}</td></tr>
      ${expanded.has(r.id) ? `<tr><td colspan="7" class="detail">${renderRun(details[r.id], r, true)}</td></tr>` : ''}`).join('')}
  </table></div>` : '<div class="empty">No finished tournaments yet.</div>');
  document.querySelectorAll('tr.row').forEach(el => el.onclick = () => {
    const id = el.dataset.id;
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    render(); poll();
  });
}

// "Pawnstorm-0.1" and "pawnstorm-v0.1" are the same version.
const versionKey = name => name.toLowerCase().replace(/[^a-z0-9.]/g, '').replace(/(\D)v(\d)/, '$1$2');

/// One point per engine version: all of its rated tests combined (inverse-variance weighted).
function versions() {
  const groups = new Map();
  runs.filter(r => r.perf != null && r.perf_err > 0).sort((a, b) => a.created - b.created).forEach(r => {
    const k = versionKey(r.main);
    if (!groups.has(k)) groups.set(k, { main: r.main, tests: [], created: r.created });
    groups.get(k).tests.push(r);
  });
  return [...groups.values()].map(g => {
    const wsum = g.tests.reduce((s, t) => s + 1 / t.perf_err ** 2, 0);
    return {
      main: g.main, created: g.created, tests: g.tests,
      perf: g.tests.reduce((s, t) => s + t.perf / t.perf_err ** 2, 0) / wsum,
      perf_err: 1 / Math.sqrt(wsum),
      games: g.tests.reduce((s, t) => s + t.games, 0),
      status: g.tests.some(t => t.status === 'running') ? 'running' : 'finished',
      name: g.tests.length === 1 ? g.tests[0].name : `${g.tests.length} tests`,
    };
  });
}

function renderRating() {
  const pts = versions();
  if (!pts.length) return `<div class="panel"><div class="rating-label">Pawnstorm rating</div><div class="rating">–</div><div class="sub">Run a rating gauntlet to get the first estimate.</div></div>`;
  const cur = pts[pts.length - 1], prev = pts.length > 1 ? pts[pts.length - 2] : null;
  const best = Math.max(...pts.filter(p => p.status !== 'running').map(p => p.perf), -Infinity);
  const live = cur.status === 'running';
  const delta = prev ? cur.perf - prev.perf : null;
  return `<div class="hero">
    <div class="panel">
      <div class="rating-label">Pawnstorm rating ${live ? '<span class="live-badge"><span class="dot running"></span>LIVE · updating as games finish</span>' : ''}</div>
      <div class="rating">${cur.perf.toFixed(0)} <small>±${cur.perf_err.toFixed(0)}</small></div>
      <div class="sub">${esc(cur.main)} · ${cur.games} rated games from ${cur.tests.length} test${cur.tests.length > 1 ? 's' : ''}</div>
      <div class="facts">
        <div class="fact"><div class="k">Change vs previous version</div><div class="v delta ${cls(delta)}">${delta == null ? '–' : sign(delta)}</div></div>
        <div class="fact"><div class="k">Best confirmed</div><div class="v">${best === -Infinity ? '–' : best.toFixed(0)}</div></div>
        <div class="fact"><div class="k">Versions rated</div><div class="v">${pts.length}</div></div>
        <div class="fact"><div class="k">Gain since first version</div><div class="v ${cls(cur.perf - pts[0].perf)}">${pts.length > 1 ? sign(cur.perf - pts[0].perf) : '–'}</div></div>
      </div>
      <div class="sub" style="font-size:12px;margin-top:14px">± is the 95% margin of error; it shrinks as more games are played.</div>
    </div>
    <div class="panel chart"><div class="rating-label" style="margin-bottom:6px">Rating by version</div>${ratingChart(pts)}</div>
  </div>`;
}

function ratingChart(pts) {
  const W = 820, H = 300, L = 52, R = 20, T = 16, B = 46;
  const lo = Math.min(...pts.map(p => p.perf - p.perf_err)), hi = Math.max(...pts.map(p => p.perf + p.perf_err));
  const pad = Math.max(40, (hi - lo) * 0.12);
  let y0 = Math.floor((lo - pad) / 50) * 50, y1 = Math.ceil((hi + pad) / 50) * 50;
  const n = pts.length;
  const X = i => n === 1 ? (L + W - R) / 2 : L + 20 + i / (n - 1) * (W - L - R - 40);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  const step = Math.max(50, Math.ceil((y1 - y0) / 5 / 50) * 50);
  for (let v = y0; v <= y1; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a313c"/><text x="${L - 8}" y="${Y(v) + 4}" fill="#8b949e" font-size="12" text-anchor="end">${v}</text>`;
  s += `<polyline points="${pts.map((p, i) => `${X(i)},${Y(p.perf)}`).join(' ')}" fill="none" stroke="#58a6ff" stroke-width="2.5"/>`;
  const every = Math.ceil(n / 10);
  pts.forEach((p, i) => {
    const x = X(i), live = p.status === 'running';
    s += `<line x1="${x}" x2="${x}" y1="${Y(p.perf - p.perf_err)}" y2="${Y(p.perf + p.perf_err)}" stroke="${live ? '#3fb950' : '#58a6ff'}" stroke-opacity=".45" stroke-width="2"/>`;
    s += `<line x1="${x - 5}" x2="${x + 5}" y1="${Y(p.perf - p.perf_err)}" y2="${Y(p.perf - p.perf_err)}" stroke="${live ? '#3fb950' : '#58a6ff'}" stroke-opacity=".45"/>`;
    s += `<line x1="${x - 5}" x2="${x + 5}" y1="${Y(p.perf + p.perf_err)}" y2="${Y(p.perf + p.perf_err)}" stroke="${live ? '#3fb950' : '#58a6ff'}" stroke-opacity=".45"/>`;
    if (live) s += `<circle cx="${x}" cy="${Y(p.perf)}" r="6" fill="none" stroke="#3fb950" stroke-width="2"><animate attributeName="r" values="6;14;6" dur="1.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/></circle>`;
    s += `<circle cx="${x}" cy="${Y(p.perf)}" r="5.5" fill="${live ? '#3fb950' : '#58a6ff'}" stroke="#0e1116" stroke-width="2"><title>${esc(p.main)}: ${p.perf.toFixed(0)} ±${p.perf_err.toFixed(0)} (${p.games} games, ${esc(p.name)})</title></circle>`;
    s += `<text x="${x}" y="${Y(p.perf) - 12}" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">${p.perf.toFixed(0)}</text>`;
    if (i % every === 0 || i === n - 1) {
      const label = p.main.length > 16 ? p.main.slice(0, 15) + '…' : p.main;
      s += `<text x="${x}" y="${H - 24}" fill="#8b949e" font-size="11" text-anchor="middle">${esc(label)}</text><text x="${x}" y="${H - 10}" fill="#5c6370" font-size="10" text-anchor="middle">${p.created ? new Date(p.created * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : ''}</text>`;
    }
  });
  return s + '</svg>';
}

function renderRun(r, b, compact) {
  if (!r) return `<h3><span class="dot ${b.status}"></span>${esc(b.name)}</h3><div class="sub" style="margin-top:8px">Loading…</div>`;
  b = r.brief; const s = r.summary;
  const pct = b.total ? Math.min(100, 100 * b.games / b.total) : 0;
  const eta = b.status === 'running' && b.games > 0 && b.total && !r.llr ? ' · ~' + dur(r.elapsed / b.games * (b.total - b.games)) + ' left' : '';
  let html = compact ? '' : `<h3><span class="dot ${b.status}"></span>${esc(b.name)} <span class="pill">${esc(b.type)}</span></h3>`;
  html += `<div class="sub" style="margin-top:${compact ? 12 : 4}px">${esc(b.tc)} · ${r.concurrency || '?'} games at a time · ${b.status === 'running' ? 'running for ' + dur(r.elapsed) : 'took ' + dur(r.elapsed)}${r.notes ? ' · ' + esc(r.notes) : ''}</div>
    <div class="cards">
      <div class="card"><div class="k">Games</div><div class="v">${b.games}${b.total ? `<span class="sub" style="font-size:.55em"> / ${b.total}</span>` : ''}</div>
        <div class="d">+${s.w} =${s.d} −${s.l}${eta}</div>${b.total ? `<div class="bar"><div style="width:${pct}%"></div></div>` : ''}</div>`;
  if (b.perf != null) html += `
      <div class="card"><div class="k">Rating from this test</div><div class="v">${b.perf.toFixed(0)} <span class="sub" style="font-size:.55em">±${b.perf_err.toFixed(0)}</span></div>
        <div class="d">${esc(b.main)}${b.derived ? ' · vs our earlier versions' : ' · vs anchor engines'}</div></div>`;
  html += `
      <div class="card"><div class="k">Elo vs field</div><div class="v ${cls(s.elo)}">${fmtElo(s.elo, s.err)}</div>
        <div class="d">score ${(s.score * 100).toFixed(1)}% · LOS ${(s.los * 100).toFixed(1)}%</div></div>`;
  if (r.llr) {
    const span = r.llr.hi - r.llr.lo, x = Math.max(0, Math.min(100, (r.llr.v - r.llr.lo) / span * 100));
    const verdict = b.verdict ? (b.verdict.includes('H1') ? '<span class="pos">PASSED ✓</span>' : '<span class="neg">FAILED ✗</span>') : 'still testing…';
    html += `
      <div class="card"><div class="k">SPRT [${r.llr.elo0 ?? ''}, ${r.llr.elo1 ?? ''}]</div><div class="v">${r.llr.v.toFixed(2)}</div>
        <div class="d">LLR (${r.llr.lo} … ${r.llr.hi}) · ${verdict}</div><div class="llr"><div class="m" style="left:${x}%"></div></div></div>`;
  }
  html += '</div>';
  if (r.problems.length) html += `<div class="warnbox">⚠ Problems: ${r.problems.map(p => `${p.count}× ${esc(p.kind)} (${esc(p.engine)})`).join(', ')}</div>`;

  if (r.live.length) html += `<h4>Live games (${r.live.length})</h4><div class="games">${r.live.map(liveGame).join('')}</div>`;

  if (r.series.length > 1) html += `<h4>Elo vs field as games come in</h4><div class="chart small">${eloChart(r.series)}</div>`;

  if (r.opponents.length) html += `<h4>Results vs opponents</h4><div class="tbl"><table>
    <tr><th>Opponent</th><th class="r">Rating</th><th class="r">Games</th><th class="r">W</th><th class="r">D</th><th class="r">L</th><th class="r">Score</th><th class="r">Elo diff</th></tr>
    ${r.opponents.map(o => `<tr><td>${esc(o.name)}</td><td class="r">${o.anchor ?? '–'}</td><td class="r">${o.w + o.d + o.l}</td>
      <td class="r">${o.w}</td><td class="r">${o.d}</td><td class="r">${o.l}</td><td class="r">${(o.score * 100).toFixed(1)}%</td>
      <td class="r ${cls(o.elo)}">${fmtElo(o.elo, o.err)}</td></tr>`).join('')}
  </table></div>`;

  if (r.recent.length) html += `<h4>Recent games</h4><div class="tbl"><table>
    <tr><th>#</th><th>White</th><th>Black</th><th>Result</th><th>How</th><th class="r">Moves</th><th class="r">Duration</th></tr>
    ${r.recent.slice(0, compact ? 10 : 12).map(g => {
      const me = b.main, rc = (g.result === '1/2-1/2') ? 'res-d' : ((g.result === '1-0') === (g.white === me)) ? 'res-w' : 'res-l';
      const how = g.termination && g.termination !== 'normal' ? `<span class="neg">${esc(g.termination)}</span> ${esc(g.reason)}` : esc(g.reason);
      return `<tr><td>${g.n}</td><td>${esc(g.white)}</td><td>${esc(g.black)}</td><td class="${rc}">${esc(g.result)}</td><td>${how}</td><td class="r">${Math.ceil(g.plies / 2)}</td><td class="r">${esc(g.duration)}</td></tr>`;
    }).join('')}
  </table></div>`;
  return html;
}

const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
function boardHtml(fen, last) {
  let h = '';
  fen.split(' ')[0].split('/').forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { for (let i = 0; i < +ch; i++) h += square(r, f++, null, last); }
      else h += square(r, f++, ch, last);
    }
  });
  return `<div class="board">${h}</div>`;
}
function square(r, f, p, last) {
  const name = 'abcdefgh'[f] + (8 - r);
  const hl = last && (last[0] === name || last[1] === name);
  const piece = p ? `<span class="pc ${p === p.toUpperCase() ? 'w' : 'b'}">${GLYPH[p.toLowerCase()]}︎</span>` : '';
  return `<div class="sq ${(r + f) % 2 ? 'd' : 'l'}${hl ? ' hl' : ''}">${piece}</div>`;
}
function liveGame(g) {
  const whitePct = 50 + 50 * (2 / (1 + Math.exp(-g.cp / 250)) - 1);
  const player = (name, t, to) => `<div class="player ${to ? 'to' : ''}"><span class="n">${to ? '<span class="dot running"></span>' : ''}${esc(name)}</span><span class="c">${clock(t)}</span></div>`;
  return `<div class="game">
    ${player(g.black, g.btime, g.thinking === g.black)}
    <div class="bw"><div class="evalbar"><div class="b" style="height:${100 - whitePct}%"></div><div class="w"></div></div>${boardHtml(g.fen, g.last)}</div>
    ${player(g.white, g.wtime, g.thinking === g.white)}
    <div class="ginfo"><span>Move <b>${g.move}</b></span><span>Eval <b>${esc(g.eval)}</b></span><span>Depth <b>${g.depth || '–'}</b></span></div>
  </div>`;
}

function eloChart(series) {
  const c = v => Math.max(-800, Math.min(800, v ?? 0));
  const pts = series.map(p => [p[0], c(p[1])]), band = series.map(p => [c(p[2]), c(p[3])]);
  const W = 800, H = 200, L = 46, R = 12, T = 12, B = 22;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]).concat(band.flat(), [0]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) x1 = x0 + 1;
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.1 || 10; y0 -= pad; y1 += pad;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a313c"/><text x="${L - 6}" y="${Y(v) + 4}" fill="#8b949e" font-size="11" text-anchor="end">${v.toFixed(0)}</text>`; }
  if (y0 < 0 && y1 > 0) s += `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#8b949e" stroke-dasharray="4 4"/>`;
  const top = pts.map((p, i) => `${X(p[0])},${Y(band[i][1])}`), bot = pts.map((p, i) => `${X(p[0])},${Y(band[i][0])}`).reverse();
  s += `<polygon points="${top.concat(bot).join(' ')}" fill="rgba(88,166,255,.15)"/>`;
  s += `<polyline points="${pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}" fill="none" stroke="#58a6ff" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  s += `<text x="${W - R}" y="${H - 4}" fill="#8b949e" font-size="11" text-anchor="end">games played →</text>`;
  return s + '</svg>';
}

poll();
setInterval(poll, 2000);
</script>

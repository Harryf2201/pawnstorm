<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Pawnstorm Lab</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1116; --panel: #161b22; --panel2: #1c222c; --border: #2a313c; --grid: #2a313c;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --on-accent: #0b1220;
    --good: #3fb950; --bad: #f85149; --warn: #d29922; --gold: #e3b341;
    --sq-light: #e8dcc0; --sq-dark: #a7825a; --hl: rgba(255, 214, 10, .45);
  }
  * { box-sizing: border-box; }
  .vbig-title { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 10px; }
  .vtitle-sub { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 8px; }
  /* Championship tab */
  .cl-wrap { overflow-x: auto; }
  table.cl, table.xt { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.cl th, table.xt th { color: var(--muted); font-weight: 600; font-size: 12px; text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.cl td { padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.cl .num, table.cl th.num { text-align: right; }
  table.cl tr.ours td:nth-child(2) b { color: var(--accent); }
  td.cl-bar { width: 38%; min-width: 160px; }
  .cl-track { position: relative; height: 14px; background: var(--panel2); border-radius: 7px; }
  .cl-err { position: absolute; top: 5px; height: 4px; background: var(--muted); opacity: .55; border-radius: 2px; }
  .cl-dot { position: absolute; top: 2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--muted); }
  .cl-dot.ours { background: var(--accent); }
  table.xt th { text-align: center; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  table.xt th.rowh { text-align: left; max-width: none; }
  table.xt tr.ours th.rowh { color: var(--accent); }
  td.xc { text-align: center; padding: 6px 4px; border: 1px solid var(--bg); font-weight: 600; min-width: 58px; }
  td.xc span { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
  td.xc.win { background: color-mix(in srgb, var(--good) calc(var(--a) * 45%), var(--panel2)); }
  td.xc.loss { background: color-mix(in srgb, var(--bad) calc(var(--a) * 45%), var(--panel2)); }
  td.xc.even, td.xc.diag { background: var(--panel2); }
  td.xc.diag { color: var(--muted); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  a { color: var(--accent); }
  header { display: flex; align-items: center; gap: 20px; padding: 10px 24px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: .3px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .hright { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  #updated { color: var(--muted); font-size: 12px; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  h2 { font-size: 13px; margin: 32px 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .8px; }
  h2:first-child { margin-top: 4px; }
  h2.sec { cursor: pointer; user-select: none; }
  h2.sec:hover { color: var(--text); }
  h2 .chev { display: inline-block; width: 16px; }
  h2 .secsum { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .lead { color: var(--muted); margin: -4px 0 14px; max-width: 70ch; }
  .sub { color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--panel2); color: var(--muted); white-space: nowrap; }
  .chip.best { color: var(--gold); border-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, transparent); }
  .chip.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 10%, transparent); }
  .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .chip.info { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .pos { color: var(--good); } .neg { color: var(--bad); } .warnc { color: var(--warn); }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; min-height: 36px; }
  .btn:hover { border-color: var(--accent); }
  .btn.sm { padding: 4px 10px; min-height: 30px; font-size: 13px; }
  .btn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .labstate { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .help { color: var(--accent); cursor: pointer; font-size: 12px; user-select: none; }
  .helptext { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .helptext b { color: var(--text); }

  /* Tabs: top bar on wide screens, thumb-friendly bottom bar on phones */
  nav#tabs { display: flex; gap: 4px; }
  nav#tabs button { background: none; border: 0; color: var(--muted); font: inherit; padding: 7px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  nav#tabs button:hover { color: var(--text); }
  nav#tabs button.active { background: var(--panel2); color: var(--text); font-weight: 600; }
  nav#tabs .ic { font-size: 15px; line-height: 1; }
  .count { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 700; }
  .count.alert { background: var(--warn); color: #fff; }
  .count:empty { display: none; }

  /* Cards, panels */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .run { margin-bottom: 18px; }
  .run h3 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .run h4 { font-size: 12px; margin: 22px 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  .card.wide { grid-column: span 2; }
  .card .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .card .v { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; background: var(--accent); transition: width .5s; }
  .bar.big { height: 10px; }
  .llr { position: relative; height: 10px; margin-top: 12px; border-radius: 5px; background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 40%, transparent), var(--panel) 50%, color-mix(in srgb, var(--good) 40%, transparent)); border: 1px solid var(--border); }
  .llr .m { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--text); transform: translateX(-2px); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.running { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); animation: pulse 1.6s infinite; }
  .dot.finished { background: var(--accent); } .dot.stopped, .dot.idle { background: var(--muted); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent; } }

  /* Overview hero */
  .hero { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 2fr); gap: 16px; }
  .rating-label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .6px; }
  .vbig { font-size: 20px; font-weight: 700; margin-top: 6px; }
  .rating { font-size: 64px; font-weight: 800; line-height: 1.05; margin: 2px 0 6px; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .rating small { font-size: 22px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; color: var(--good); font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--good) 12%, transparent); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); padding: 2px 10px; border-radius: 999px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .fact .k { color: var(--muted); font-size: 12px; } .fact .v { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .chart svg { width: 100%; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  svg .gl { stroke: var(--grid); } svg .ax { fill: var(--muted); font-size: 11px; } svg .axl { fill: var(--text); font-size: 12px; font-weight: 700; }

  /* "Right now" */
  .now-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .now-head h3 { margin: 0; font-size: 18px; flex: 1; min-width: 120px; }
  .now-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--border); cursor: pointer; border-radius: 6px; }
  .now-row:first-of-type { border-top: 0; }
  .now-row:hover { background: var(--panel2); }
  .now-row .dot { margin-top: 6px; }
  .now-ic { font-size: 18px; line-height: 1.3; width: 24px; text-align: center; flex: none; }
  .now-main { flex: 1; min-width: 0; }
  .now-t { font-weight: 600; overflow-wrap: anywhere; }
  .now-d { color: var(--muted); font-size: 13px; }
  .now-row.idle .now-t { color: var(--muted); font-weight: 500; }
  .now-bar { width: 110px; flex: none; align-self: center; text-align: right; font-size: 12px; color: var(--muted); }
  .now-bar .bar { margin-top: 4px; }
  .alertbox { background: color-mix(in srgb, var(--warn) 10%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600; }
  .warnbox { background: color-mix(in srgb, var(--warn) 10%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }

  /* Version cards */
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar .sub { margin-right: 4px; }
  .vlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 14px; align-items: start; }
  .vcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .vcard.is-best { border-color: var(--gold); background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 9%, transparent), var(--panel) 55%); }
  .vcard.is-worse { opacity: .92; }
  .vtop { display: flex; justify-content: space-between; gap: 12px; cursor: pointer; }
  .vtitle { font-size: 20px; font-weight: 800; }
  .vchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .vrate { text-align: right; flex: none; }
  .vrate b { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .vrate small { display: block; color: var(--muted); font-size: 12px; }
  .vdesc { margin-top: 8px; font-size: 13px; }
  .level { margin-top: 6px; font-weight: 600; font-size: 13px; }
  .scale { position: relative; height: 8px; background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; margin: 14px 0 4px; }
  .scale .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; opacity: .85; }
  .scale .err { position: absolute; top: 2px; height: 2px; background: var(--text); opacity: .55; transform: translateY(1px); }
  .scale.best .fill { background: var(--gold); } .scale.worse .fill { background: var(--warn); } .scale.same .fill { background: var(--muted); }
  .scale-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .vstats { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 13px; margin-top: 10px; }
  .vstats b { color: var(--text); }
  .score { display: inline-flex; gap: 5px; align-items: baseline; padding: 1px 8px; border-radius: 6px; font-size: 12px; background: var(--panel2); border: 1px solid var(--border); white-space: nowrap; }
  .score.good b { color: var(--good); } .score.bad b { color: var(--bad); }
  .vach { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .vmore { color: var(--accent); font-size: 12px; margin-top: 10px; cursor: pointer; user-select: none; }
  .vsum { margin-top: 10px; }
  .vbuild { margin-top: 12px; padding: 9px 12px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 8px; background: color-mix(in srgb, var(--accent) 9%, transparent); font-size: 13px; }
  .vmeta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 14px; margin: 10px 0 0; font-size: 13px; }
  .vmeta dt { color: var(--muted); } .vmeta dd { margin: 0; overflow-wrap: anywhere; }
  code { font: 12px Consolas, monospace; background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .vcard.planned { border-style: dashed; background: transparent; }
  .vcard.planned .vtitle { color: var(--muted); }
  .chip.plan { border-style: dashed; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  .tbl { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }

  /* Tournaments list */
  .trow { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
  .trow-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .trow-top:hover { background: var(--panel2); border-radius: 12px; }
  .trow-main { flex: 1; min-width: 0; }
  .trow-main b { overflow-wrap: anywhere; }
  .trow-res { text-align: right; flex: none; }
  .trow-body { padding: 0 16px 16px; }
  .chev2 { color: var(--muted); width: 14px; flex: none; }

  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .game { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .player { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 4px 2px; gap: 8px; }
  .player .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .player .c { font-variant-numeric: tabular-nums; background: var(--bg); padding: 1px 6px; border-radius: 4px; }
  .player.to .c { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .bw { display: flex; gap: 6px; }
  .evalbar { width: 10px; border-radius: 3px; overflow: hidden; background: #333; display: flex; flex-direction: column; border: 1px solid var(--border); }
  .evalbar .b { background: #2b2b2b; transition: height .4s; } .evalbar .w { background: #f0f0f0; flex: 1; }
  .board { flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; border-radius: 4px; overflow: hidden; container-type: inline-size; }
  .sq { display: flex; align-items: center; justify-content: center; position: relative; }
  .sq.l { background: var(--sq-light); } .sq.d { background: var(--sq-dark); }
  .sq.hl::after { content: ""; position: absolute; inset: 0; background: var(--hl); }
  .pc { font-family: "Segoe UI Symbol", "DejaVu Sans", serif; font-size: 10.5cqw; line-height: 1; position: relative; z-index: 1; }
  .pc.w { color: #fff; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 0 1px #000, 0 1px 2px rgba(0,0,0,.5); }
  .pc.b { color: #161616; text-shadow: 0 0 1px rgba(255,255,255,.4); }
  .ginfo { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .ginfo b { color: var(--text); }
  .empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }
  .res-w { color: var(--good); font-weight: 700; } .res-l { color: var(--bad); font-weight: 700; } .res-d { color: var(--muted); font-weight: 700; }

  /* Achievements */
  .ach-list { display: flex; flex-direction: column; gap: 8px; }
  .ach { display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
  .ach .ic { font-size: 24px; line-height: 1; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: var(--panel2); flex: none; }
  .ach .body { flex: 1; min-width: 0; }
  .ach .t { font-weight: 700; font-size: 15px; } .ach .d { color: var(--muted); font-size: 13px; margin-top: 1px; overflow-wrap: anywhere; }
  .ach .w { color: var(--muted); font-size: 12px; text-align: right; flex: none; max-width: 40%; overflow-wrap: anywhere; }
  .ach.gold { border-color: color-mix(in srgb, var(--gold) 60%, transparent); background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 12%, transparent), var(--panel) 60%); }
  .ach.gold .ic { background: color-mix(in srgb, var(--gold) 20%, transparent); }
  .ach.silver { border-color: color-mix(in srgb, var(--muted) 55%, transparent); } .ach.silver .ic { background: color-mix(in srgb, var(--muted) 15%, transparent); }
  .ach.bronze .ic { background: rgba(205,127,50,.18); }
  .ach.locked .ic { filter: grayscale(1); opacity: .5; } .ach.locked .t { color: var(--muted); }
  .ach.mini { padding: 8px 12px; } .ach.mini .ic { width: 34px; height: 34px; font-size: 19px; }
  .ach .wmain { display: block; }

  [data-toggle]:focus-visible, [data-go]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .dot.running { animation: none; } .bar > div { transition: none; } }

  /* Phones */
  @media (max-width: 860px) {
    .btn.sm { min-height: 40px; }
    th, td { padding: 7px 8px; }
    .hero, .two { grid-template-columns: minmax(0, 1fr); }
    .rating { font-size: 52px; }
    main { padding: 16px 14px 96px; }
    header { padding: 8px 14px; gap: 10px; }
    #updated { display: none; }
    nav#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--panel); border-top: 1px solid var(--border); padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); gap: 2px; }
    nav#tabs button { flex: 1; flex-direction: column; gap: 1px; padding: 6px 2px; font-size: 11px; min-width: 0; position: relative; }
    nav#tabs .ic { font-size: 20px; }
    nav#tabs .count { position: absolute; top: 0; right: calc(50% - 22px); font-size: 10px; padding: 0 5px; }
    .vlist { grid-template-columns: minmax(0, 1fr); }
    .card.wide { grid-column: 1 / -1; }
    .cards { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .card .v { font-size: 21px; }
    .now-bar { width: 70px; }
    .ach { flex-wrap: wrap; row-gap: 6px; }
    .ach .w { flex-basis: 100%; max-width: none; text-align: left; padding-left: 56px; }
    .ach.mini .w { padding-left: 48px; }
    .ach .wmain { display: inline; margin-left: 8px; }
    .vrate b { font-size: 28px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">♞ Pawnstorm <span>Lab</span></div>
  <nav id="tabs"></nav>
  <div class="hright">
    <span id="updated"></span>
    <span id="labstate"></span>
  </div>
</header>
<main><div id="view"></div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sign = v => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(0);
const cls = e => e > 0 ? 'pos' : e < 0 ? 'neg' : '';
const fmtElo = (e, err) => e == null ? '–' : `${e > 0 ? '+' : ''}${e.toFixed(1)}${err != null ? ` <span class="sub" style="font-size:.65em">±${err.toFixed(1)}</span>` : ''}`;
const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const clock = ms => { const s = Math.max(0, ms) / 1000; return s >= 60 ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : s.toFixed(1); };
const when = t => { const d = new Date(t * 1000); return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); };
const big = n => n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
const pct = (w, d, n) => n ? 100 * (w + d / 2) / n : null;

// ---- UI state (remembered between visits) ----
const TABS = [['overview', 'Overview', '🏠'], ['versions', 'Versions', '📈'], ['championship', 'Championship', '🏁'], ['tournaments', 'Tournaments', '⚔️'], ['achievements', 'Achievements', '🏆'], ['lab', 'Lab', '🔧']];
const ui = { state: {}, sort: 'new', group: 'cat' };
try { const s = JSON.parse(localStorage.getItem('pawn-ui') || '{}'); Object.assign(ui, s); } catch (e) {}
const saveUi = () => { try { localStorage.setItem('pawn-ui', JSON.stringify({ state: ui.state, sort: ui.sort, group: ui.group })); } catch (e) {} };
const isOpen = (k, def = false) => k in ui.state ? ui.state[k] : def;
let tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'overview';

function setHtml(el, html) {
  if (el._h === html) return;
  el.innerHTML = html; el._h = html;
  // Make the clickable rows usable from the keyboard / by screen readers.
  el.querySelectorAll('[data-toggle],[data-go]').forEach(n => {
    if (!n.matches('button')) { n.tabIndex = 0; n.setAttribute('role', 'button'); }
    if (n.dataset.toggle) n.setAttribute('aria-expanded', String(isOpen(n.dataset.toggle, n.dataset.def === '1')));
  });
}
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function goTab(t, openRun) {
  if (openRun) { ui.state['run:' + openRun] = true; saveUi(); }
  if (location.hash.slice(1) !== t) location.hash = t; else render();
  window.scrollTo(0, 0);
  if (openRun) poll();
}
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.some(x => x[0] === t)) { tab = t; render(); window.scrollTo(0, 0); } });
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(render, 150); });

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
});

// One click handler for everything interactive (the page re-renders every couple of seconds).
document.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const t = e.target.closest('[data-toggle],[data-go],[data-act],[data-set]');
  if (!t) return;
  const d = t.dataset;
  if (d.toggle) {
    ui.state[d.toggle] = !isOpen(d.toggle, d.def === '1'); saveUi(); render();
    if (d.toggle.startsWith('run:')) poll();
  } else if (d.go) goTab(d.go, d.run);
  else if (d.set) { const [k, v] = d.set.split(':'); ui[k] = v; saveUi(); render(); }
  else if (d.act) doAction(d.act);
});

// ---- Data ----
let runs = [], details = {}, ach = null, ratings = [], gens = [], trains = [], preps = [], health = null, lab = null, schedule = null, genRate = {}, prepRate = {};

/// Recent speed, measured between polls (falls back to the average since start).
function trackRate(g) {
  const prev = genRate[g.name], t = g.updated;
  if (prev && t > prev.t && g.positions >= prev.positions) {
    const inst = (g.positions - prev.positions) / (t - prev.t);
    g.rate = prev.rate == null ? inst : prev.rate * 0.8 + inst * 0.2;
  } else g.rate = prev?.rate ?? g.positions / Math.max(1, g.updated - g.started);
  if (!prev || t > prev.t) genRate[g.name] = { t, positions: g.positions, rate: g.rate };
}

// Engine names -> friendly version names, from versions.ini (served by /api/versions).
// "Pawnstorm-0.1", "pawnstorm-v0.1" and every other name listed for a version are the same engine.
let catalog = [], aliasMap = {}, aliasRe = null, titleMap = {};
const ekey = n => {
  const s = String(n).toLowerCase().replace(/[^a-z0-9.]/g, '');
  let o = '';
  for (let i = 0; i < s.length; i++) if (!(s[i] === 'v' && i > 0 && !/\d/.test(s[i - 1]) && /\d/.test(s[i + 1] || ''))) o += s[i];
  return o;
};
function setCatalog(c) {
  catalog = c; aliasMap = {}; titleMap = Object.fromEntries(c.map(v => [v.name, v.title || '']));
  const raw = [];
  c.forEach(v => { aliasMap[ekey(v.name)] = v.name; v.engines.forEach(e => { aliasMap[ekey(e)] = v.name; raw.push([e, v.name]); }); });
  raw.sort((a, b) => b[0].length - a[0].length);
  aliasRe = raw.length ? new RegExp(raw.map(r => r[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi') : null;
  if (aliasRe) aliasRe._map = Object.fromEntries(raw.map(r => [r[0].toLowerCase(), r[1]]));
}
const canon = n => String(n).replace(/^pawnstorm[-_ ]?v?(\d)/i, 'pawnstorm-v$1');
/// Friendly name for one engine name; names not in the catalog just lose the "pawnstorm-" prefix.
/// Display names for the other engines we play.
const OTHER_ENGINES = { stockfish: 'Stockfish 18', rubichess: 'RubiChess', dragon: 'Komodo Dragon', plentychess: 'PlentyChess' };
const short = n => OTHER_ENGINES[String(n).toLowerCase()] || aliasMap[ekey(n)] || canon(n).replace(/^pawnstorm-/i, '');
/// The same for engine names buried in free text (tournament titles, achievement descriptions).
const friendlyText = s => {
  let t = String(s ?? '');
  if (aliasRe) t = t.replace(aliasRe, m => aliasRe._map[m.toLowerCase()] || m);
  t = t.replace(/\b(stockfish|rubichess|dragon|plentychess)\b/g, m => OTHER_ENGINES[m]);
  return t.replace(/\bpawnstorm[-_ ]?v?(\d)/gi, 'v$1');
};
const isOurs = n => !!aliasMap[ekey(n)] || /^pawnstorm/i.test(n);
/// "v1.2 · Gen2, 260M": the version name plus its title from versions.ini (other engines: just the name).
const label = n => { const s = short(n), t = titleMap[s]; return t ? s + ' · ' + t : s; };
/// Main versions are plain numbers (v1.3); experiments add a letter (v1.2k). Dropped and planned ones aren't main.
const isMajor = name => { const c = catalog.find(v => v.name === name); return /^v\d+(\.\d+)+$/.test(name) && !(c && ['failed', 'planned'].includes(c.status)); };

/// Everything about the engine versions, derived from the server's joint rating fit.
function versionModel() {
  const pts = ratings.filter(r => isOurs(r.name)).map(r => ({
    key: short(r.name), name: short(r.name), short: short(r.name), perf: r.rating, err: r.err,
    games: r.games, first: r.first_seen, live: r.live, vs: (r.vs || []).map(o => ({ ...o, name: short(o.name), n: o.w + o.d + o.l })),
  })).sort((a, b) => a.first - b.first);
  pts.forEach(p => { p.title = titleMap[p.key] || ''; p.label = p.title ? p.key + ' · ' + p.title : p.key; });
  // Headline = strongest main version. Versions with too few games (huge error margin) don't qualify,
  // so a lucky early result can't replace it; experiments (v1.2k...) count once promoted to a main version.
  const majorPts = pts.filter(p => isMajor(p.key)).map(p => ({ ...p }));
  const solid = majorPts.filter(p => p.err <= 100);
  const pool = solid.length ? solid : majorPts.length ? majorPts : pts;
  const top = pool.reduce((b, p) => !b || p.perf > b.perf ? p : b, null);
  const topKey = top && top.key;
  annotate(pts, topKey);
  annotate(majorPts, topKey);
  return { pts, major: majorPts, strongest: majorPts.find(p => p.key === topKey) || pts.find(p => p.key === topKey) || null };
}

/// Index, verdict against the best version before it, and the best-so-far line, in build order.
function annotate(pts, strongestKey) {
  let prevBest = null;
  pts.forEach((p, i) => {
    p.index = i; p.prev = prevBest;
    p.gain = prevBest ? p.perf - prevBest.perf : null;
    const margin = prevBest ? Math.hypot(p.err, prevBest.err) : 0;
    p.verdict = !prevBest ? 'first' : p.gain > margin ? 'better' : p.gain < -margin ? 'worse' : 'same';
    p.strongest = p.key === strongestKey;
    p.provisional = p.err > 100;
    if (!prevBest || p.perf > prevBest.perf) prevBest = p;
    p.best = prevBest; // best version so far, as of this one
  });
}

/// "Beats SF-2900, loses to SF-3100", from results against fixed-strength Stockfish.
function levelText(p) {
  const sf = p.vs.filter(o => o.anchor != null && o.n >= 10).sort((a, b) => a.anchor - b.anchor);
  // How many standard errors the score is from 50%: a small sample above 50% is not "beating" anyone.
  const z = o => (pct(o.w, o.d, o.n) / 100 - 0.5) / (0.5 / Math.sqrt(o.n));
  const beat = sf.filter(o => z(o) >= 1).pop();
  const lose = sf.filter(o => z(o) <= -1 && (!beat || o.anchor > beat.anchor))[0];
  const level = sf.filter(o => Math.abs(z(o)) < 1 && (!beat || o.anchor > beat.anchor) && (!lose || o.anchor < lose.anchor)).pop();
  const bits = [];
  if (beat) bits.push(`Beats ${esc(beat.name)}`);
  if (level) bits.push(`${bits.length ? 'level with' : 'Level with'} ${esc(level.name)}`);
  if (lose) bits.push(`${bits.length ? 'loses to' : 'Loses to'} ${esc(lose.name)}`);
  return bits.join(' · ') || 'Not enough games against Stockfish yet';
}

/// Status words from versions.ini -> [chip style, label].
const STATUS = {
  main: ['', 'Main line'],
  best: ['best', '★ Best'],
  testing: ['info', 'Testing'],
  passed: ['good', '✓ Passed'],
  failed: ['bad', '✗ Failed'],
  planned: ['plan', 'Planned'],
};
const statusChip = s => { const [c, t] = STATUS[s] || ['', s || 'Unlisted']; return `<span class="chip ${c}">${esc(t)}</span>`; };

function achByVersion() {
  const m = {};
  (ach?.items || []).filter(a => a.unlocked && a.main).forEach(a => (m[short(a.main)] ||= []).push(a));
  return m;
}

// ---- Charts (sized to the real pixel width so text stays readable on phones) ----
const viewW = () => Math.max(300, Math.min($('#view').clientWidth || 360, 1280));

function ratingChart(pts, W) {
  const H = 280, L = 46, R = 14, T = 18, B = 42;
  const lo = Math.min(...pts.map(p => p.perf - p.err)), hi = Math.max(...pts.map(p => p.perf + p.err));
  const pad = Math.max(40, (hi - lo) * 0.12);
  const y0 = Math.floor((lo - pad) / 50) * 50, y1 = Math.ceil((hi + pad) / 50) * 50;
  const n = pts.length;
  const X = i => n === 1 ? (L + W - R) / 2 : L + 16 + i / (n - 1) * (W - L - R - 32);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  const step = Math.max(50, Math.ceil((y1 - y0) / 5 / 50) * 50);
  for (let v = y0; v <= y1; v += step) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  // The line is the best version so far: experiments that don't beat it appear as dots below it.
  s += `<polyline points="${pts.map((p, i) => `${X(i)},${Y(p.best.perf)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-opacity=".8"/>`;
  // Label a point only if there is room: the strongest and the newest always get one, others fill the gaps.
  const gap = 44, shown = new Set(), xs = pts.map((_, i) => X(i));
  const fits = i => [...shown].every(j => Math.abs(xs[i] - xs[j]) >= gap);
  pts.forEach((p, i) => { if (p.strongest) shown.add(i); });
  if (!shown.has(n - 1) && fits(n - 1)) shown.add(n - 1);
  for (let i = 0; i < n; i++) if (!shown.has(i) && fits(i)) shown.add(i);
  const every = Math.max(1, Math.ceil(gap / Math.max(1, (W - L - R - 32) / Math.max(1, n - 1))));
  const COL = { first: 'var(--accent)', better: 'var(--accent)', same: 'var(--muted)', worse: 'var(--warn)' };
  pts.forEach((p, i) => {
    const x = X(i), col = p.strongest ? 'var(--gold)' : COL[p.verdict];
    s += `<line x1="${x}" x2="${x}" y1="${Y(p.perf - p.err)}" y2="${Y(p.perf + p.err)}" stroke="${col}" stroke-opacity=".5" stroke-width="2"/>`;
    s += `<line x1="${x - 4}" x2="${x + 4}" y1="${Y(p.perf - p.err)}" y2="${Y(p.perf - p.err)}" stroke="${col}" stroke-opacity=".5"/><line x1="${x - 4}" x2="${x + 4}" y1="${Y(p.perf + p.err)}" y2="${Y(p.perf + p.err)}" stroke="${col}" stroke-opacity=".5"/>`;
    if (p.live) s += `<circle cx="${x}" cy="${Y(p.perf)}" r="${reduceMotion ? 10 : 6}" fill="none" stroke="var(--good)" stroke-width="2">${reduceMotion ? '' : '<animate attributeName="r" values="6;14;6" dur="1.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>'}</circle>`;
    // Experiments that didn't beat the best version so far are hollow rings, so they can't be mistaken for progress.
    const hollow = p.verdict === 'worse' && !p.strongest;
    s += `<circle cx="${x}" cy="${Y(p.perf)}" r="${p.strongest ? 7 : 5.5}" fill="${hollow ? 'var(--panel)' : col}" stroke="${hollow ? col : 'var(--panel)'}" stroke-width="${hollow ? 2.5 : 2}"><title>${esc(p.label || p.short)}: ${p.perf.toFixed(0)} ±${p.err.toFixed(0)} (${p.games} games)</title></circle>`;
    if (shown.has(i)) {
      s += `<text class="axl" x="${x}" y="${Y(p.perf + p.err) - 6}" text-anchor="middle">${p.perf.toFixed(0)}</text>`;
      const room = Math.max(5, Math.floor((W - L - R - 32) / Math.max(1, n - 1) * every / 6.4));
      const label = p.short.length > room ? p.short.slice(0, room - 1) + '…' : p.short;
      s += `<text class="ax" x="${x}" y="${H - 22}" text-anchor="middle">${esc(label)}</text>`;
      if (p.first) s += `<text class="ax" x="${x}" y="${H - 8}" text-anchor="middle" style="font-size:10px">${new Date(p.first * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</text>`;
    }
  });
  return s + '</svg>';
}

function tempChart(rows, W) {
  const H = 160, L = 40, R = 12, T = 10, B = 20;
  const t0 = rows[0][0], t1 = Math.max(rows[rows.length - 1][0], t0 + 1);
  const X = t => L + (t - t0) / (t1 - t0) * (W - L - R), Y = v => T + (1 - (v - 20) / (105 - 20)) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  for (const v of [40, 60, 80, 100]) s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}°</text>`;
  const lim = Number(String(health.limit_cpu_temp || '92').split(',')[0]);
  s += `<line x1="${L}" x2="${W - R}" y1="${Y(lim)}" y2="${Y(lim)}" stroke="var(--bad)" stroke-dasharray="5 4" stroke-opacity=".7"/><text x="${W - R}" y="${Y(lim) - 4}" fill="var(--bad)" font-size="10" text-anchor="end">pause line</text>`;
  const line = (i, color) => { const pts = rows.filter(r => r[i] != null).map(r => `${X(r[0])},${Y(r[i])}`); return pts.length ? `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2"/>` : ''; };
  s += line(1, 'var(--accent)') + line(2, 'var(--good)') + line(5, 'var(--warn)');
  s += `<text x="${L + 4}" y="${H - 4}" font-size="11"><tspan fill="var(--accent)">■ CPU</tspan>  <tspan fill="var(--good)">■ GPU</tspan>  <tspan fill="var(--warn)">■ SSD</tspan></text>`;
  return s + '</svg>';
}

function lossChart(losses, W) {
  const H = 160, L = 64, R = 12, T = 10, B = 22;
  const ys = losses.map(l => l[1]);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.1 || y1 * 0.05; y0 -= pad; y1 += pad;
  const x0 = losses[0][0], x1 = Math.max(losses[losses.length - 1][0], x0 + 1);
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3; s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(5)}</text>`; }
  s += `<polyline points="${losses.map(l => `${X(l[0])},${Y(l[1])}`).join(' ')}" fill="none" stroke="var(--warn)" stroke-width="2"/>`;
  if (losses.length < 60) losses.forEach(l => s += `<circle cx="${X(l[0])}" cy="${Y(l[1])}" r="3" fill="var(--warn)"/>`);
  return s + `<text class="ax" x="${W - R}" y="${H - 4}" text-anchor="end">training round →</text></svg>`;
}

function eloChart(series, W) {
  const c = v => Math.max(-800, Math.min(800, v ?? 0));
  const pts = series.map(p => [p[0], c(p[1])]), band = series.map(p => [c(p[2]), c(p[3])]);
  const H = 200, L = 46, R = 12, T = 12, B = 22;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]).concat(band.flat(), [0]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) x1 = x0 + 1;
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * 0.1 || 10; y0 -= pad; y1 += pad;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}">`;
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(0)}</text>`; }
  if (y0 < 0 && y1 > 0) s += `<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  const top = pts.map((p, i) => `${X(p[0])},${Y(band[i][1])}`), bot = pts.map((p, i) => `${X(p[0])},${Y(band[i][0])}`).reverse();
  s += `<polygon points="${top.concat(bot).join(' ')}" fill="var(--accent)" fill-opacity=".15"/>`;
  s += `<polyline points="${pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  s += `<text class="ax" x="${W - R}" y="${H - 4}" text-anchor="end">games played →</text>`;
  return s + '</svg>';
}

// ---- Overview ----
const helpBlock = (key, label, text) => `<div style="margin-top:12px"><span class="help" data-toggle="${key}">ⓘ ${label} ${isOpen(key) ? '▾' : '▸'}</span>${isOpen(key) ? `<div class="helptext">${text}</div>` : ''}</div>`;

const HELP_RATING = `<b>Rating</b> is an Elo-style strength score: +100 means winning about 64% of games against an equal-footing opponent a hundred points lower.
  Pawnstorm is measured by playing <b>Stockfish locked to fixed strengths</b> (“SF-2900” is Stockfish limited to 2900) and its own earlier versions.
  <b>±</b> is the 95% margin of error; it shrinks as more games are played. The scale is relative to these opponents, not an official rating.`;

function renderHero(m) {
  const pts = m.major.length ? m.major : m.pts, cur = m.strongest;
  if (!cur) return `<div class="panel"><div class="rating-label">Pawnstorm rating</div><div class="rating">–</div><div class="sub">Run a rating gauntlet to get the first estimate.</div></div>`;
  const earlier = pts.slice(0, cur.index);
  const prev = earlier.length ? earlier.reduce((b, p) => p.perf > b.perf ? p : b) : null;
  const delta = prev ? cur.perf - prev.perf : null;
  const gamesAll = runs.reduce((s, r) => s + r.games, 0);
  const W = viewW() > 860 ? Math.round((viewW() - 16) * 2 / 3) - 40 : viewW() - 40;
  const experiments = catalog.filter(c => c.status === 'failed').length;
  return `<div class="hero">
    <div class="panel">
      <div class="rating-label">Strongest version so far ${cur.live ? '<span class="live-badge"><span class="dot running"></span>updating live</span>' : ''}</div>
      <div class="vbig">${esc(cur.short)}${cur.title ? `<span class="vbig-title">${esc(cur.title)}</span>` : ''}</div>
      <div class="rating">${cur.perf.toFixed(0)} <small>±${cur.err.toFixed(0)}</small></div>
      <div>${delta == null ? '<span class="chip">First version</span>' : `<span class="chip ${delta > 0 ? 'good' : ''}">${sign(delta)} Elo</span> <span class="sub">over the previous best (${esc(prev.short)})</span>`}</div>
      <div class="level">${levelText(cur)}</div>
      <div class="facts">
        <div class="fact"><div class="k">Versions tested</div><div class="v">${m.pts.length}${experiments ? `<span class="sub" style="font-weight:500;font-size:12px"> · ${experiments} experiment${experiments > 1 ? 's' : ''} didn't help</span>` : ''}</div></div>
        <div class="fact"><div class="k">Games played</div><div class="v">${big(gamesAll)}</div></div>
        <div class="fact"><div class="k">Gain since first version</div><div class="v ${cls(cur.perf - pts[0].perf)}">${pts.length > 1 ? sign(cur.perf - pts[0].perf) + ' Elo' : '–'}</div></div>
        <div class="fact"><div class="k">First rated</div><div class="v">${pts[0].first ? new Date(pts[0].first * 1000).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '–'}</div></div>
      </div>
      ${helpBlock('help:rating', 'What do these numbers mean?', HELP_RATING)}
    </div>
    <div class="panel chart"><div class="rating-label" style="margin-bottom:6px">Rating of each main version, in the order they were built <span class="sub" style="text-transform:none;letter-spacing:0">(experiments are on the Versions tab)</span></div>${ratingChart(pts, W)}
      <div class="legend"><span><i style="background:var(--gold)"></i>Strongest</span><span><i style="background:var(--accent)"></i>Improved</span><span><i style="background:var(--muted)"></i>About the same</span><span><i style="background:var(--panel);border:2px solid var(--warn)"></i>Weaker experiment</span><span>━ best so far</span></div>
    </div>
  </div>`;
}

/// Plain-language list of what the lab is doing right now.
function nowRows() {
  const rows = [], alerts = [];
  const live = runs.filter(r => r.status === 'running');
  if (!live.length) rows.push({ state: 'idle', icon: '⚔️', t: 'No tournaments running', d: 'Tournaments are batches of games that measure how strong a version is.', go: 'tournaments' });
  live.forEach(r => {
    const d = details[r.id];
    const s = d && d.summary, n = s ? s.w + s.d + s.l : r.games;
    const eta = d && r.games > 0 && r.total && !d.llr && r.type !== 'sprt' ? dur(d.elapsed / r.games * (r.total - r.games)) : null;
    const sc = s && n ? ` · ${esc(short(r.main))} is scoring ${(100 * s.score).toFixed(0)}% so far` : '';
    rows.push({
      state: 'running', icon: '⚔️', t: friendlyText(r.name),
      d: `${r.type === 'sprt' ? 'Improvement test' : 'Tournament'} · game ${r.games}${r.type === 'sprt' ? ' (stops as soon as the result is clear)' : r.total ? ' of ' + r.total : ''}${eta ? ' · about ' + eta + ' left' : ''}${sc}`,
      pct: r.total && r.type !== 'sprt' ? 100 * r.games / r.total : null, go: 'tournaments',
    });
  });
  const genRun = gens.filter(genRunning);
  const local = genRun.filter(g => !g.source), cloud = genRun.filter(g => g.source === 'cloud');
  genRun.filter(g => g.source === 'oracle').forEach(g => rows.push({ state: 'running', icon: '🖥️', t: 'Oracle Cloud server is generating training data', d: `${g.threads} cores, always on · about ${big(g.rate_h || 0)} per hour · ${big(g.positions)} positions collected so far`, go: 'lab' }));
  local.forEach(g => rows.push({ state: 'running', icon: '🧪', t: 'Generating training data on this PC', d: `${big(g.positions)} positions so far · about ${big(Math.round((g.rate || 0) * 3600))} per hour · the engine plays itself and keeps the positions`, go: 'lab' }));
  if (!local.length) rows.push({ state: 'idle', icon: '🧪', t: 'Training-data generation on this PC is off', d: lab && lab.datagen === false ? 'Use Start lab to resume it.' : '', go: 'lab' });
  cloud.forEach(g => {
    const left = Math.max(0, (g.minutes || 330) * 60 + 300 - (g.now - g.started));
    rows.push({ state: 'running', icon: '☁️', t: 'Cloud data batch is running on GitHub', d: `${g.jobs_running || 0} of ${g.jobs_total || 0} jobs running · about ${dur(left)} left · ${g.positions ? big(g.positions) + ' positions downloaded so far' : g.est_per_job ? '~' + big(Math.round(g.est_per_job * (g.jobs_total || 0) * Math.min(1, (g.now - g.started) / ((g.minutes || 330) * 60)))) + ' positions generated so far (est.)' : 'positions download when jobs finish'}`, go: 'lab' });
  });
  const queued = gens.filter(g => g.source === 'cloud' && g.state === 'queued');
  if (queued.length) rows.push({ state: 'idle', icon: '☁️', t: `${queued.length} cloud batch${queued.length > 1 ? 'es' : ''} waiting in line`, d: 'Only one batch runs at a time.', go: 'lab' });
  const nj = nextJob();
  if (nj) rows.push({ state: nj.state === 'waiting' ? 'idle' : 'running', icon: '📅', t: `Automatic job: ${friendlyText(nj.title)}`, d: nj.state === 'waiting' && nj.start ? `Starts at ${hm(nj.start)}${nj.start > Date.now() / 1000 ? ' (in ' + dur(nj.start - Date.now() / 1000) + ')' : ''} · ${friendlyText(nj.detail)}` : friendlyText(nj.detail), go: 'lab' });
  preps.forEach(p => {
    const q = prepView(p), v = netVersion(p.name);
    rows.push({
      state: q.idle > 900 ? 'idle' : 'running', icon: '📦', t: `Preparing training data${v ? ' for ' + v : ''}`,
      d: `Step ${p.step} of 3: ${PREP_STAGE[p.stage]}${q.pct != null ? ' · ' + q.pct.toFixed(0) + '%' : ''}${q.left ? ' · about ' + q.left + ' left' : ''}. Training starts by itself afterwards.`,
      pct: q.pct, go: 'lab',
    });
  });
  const tr = trains.filter(t => t.state === 'running');
  tr.forEach(t => {
    const g = trainProg(t), v = netVersion(t.net || t.name);
    rows.push({ state: 'running', icon: '🧠', t: v ? `Training the ${v} network` : `Training neural network “${t.net || t.name}”`, d: `Round ${t.sb || 0} of ${t.end_sb}${g.left ? ' · about ' + g.left + ' left' : ''} · on the graphics card`, pct: t.end_sb ? g.pct : null, go: 'lab' });
  });
  if (!tr.length) rows.push({ state: 'idle', icon: '🧠', t: 'Graphics card is idle', d: preps.length ? 'Waiting for the training data to be ready.' : 'No neural network is being trained right now.', go: 'lab' });
  trains.filter(t => t.state === 'failed').slice(-1).forEach(t => alerts.push(`Training “${t.net || t.name}” failed: ${t.error}`));
  gens.filter(g => g.cloud_stopped).slice(0, 1).forEach(g => alerts.push(`Cloud data generation stopped: ${g.cloud_stopped}`));
  if (health && health.updated) {
    const stale = health.now - health.updated > 30;
    if (stale) alerts.push('The watchdog stopped responding, so temperatures are not being monitored.');
    else if (health.level === 'ok') rows.push({ state: 'finished', icon: '🌡️', t: 'Temperatures are normal', d: `CPU ${health.cpu_temp ?? '–'}°C · GPU ${health.gpu_temp ?? '–'}°C · everything within safe limits`, go: 'lab' });
    else alerts.push(health.level === 'manual' ? 'Everything is paused by you.' : `Paused for safety: ${health.reason}`);
  } else if (health) alerts.push('The watchdog is not running, so temperatures are not being monitored.');
  return { rows, alerts };
}

function labControls() {
  if (!lab) return '';
  const parts = ['datagen', 'watchdog', 'cloud_sync', 'oracle_sync'];
  const on = parts.filter(k => lab[k]).length;
  const paused = health && ['manual', 'warn', 'critical'].includes(health.level);
  let b = '';
  if (lab.busy) return `<span class="sub">${lab.busy === 'start' ? 'Starting…' : 'Stopping…'}</span>`;
  if (on < parts.length) b += `<button class="btn sm" data-act="lab-start">▶ Start lab</button>`;
  if (on > 0) b += `<button class="btn sm" data-act="lab-stop">■ Stop lab</button>`;
  if (health && health.updated) b += paused ? `<button class="btn sm" data-act="resume">▶ Resume</button>` : `<button class="btn sm" data-act="pause">⏸ Pause</button>`;
  return b;
}

function renderNow() {
  const { rows, alerts } = nowRows();
  return `<div class="panel run" style="margin-top:16px">
    <div class="now-head"><h3>Right now</h3><div style="display:flex;gap:6px;flex-wrap:wrap">${labControls()}</div></div>
    ${alerts.map(a => `<div class="alertbox" data-go="lab">⚠ ${esc(a)}</div>`).join('')}
    ${rows.map(r => `<div class="now-row ${r.state === 'idle' ? 'idle' : ''}" data-go="${r.go}">
      <span class="now-ic">${r.icon}</span>
      <div class="now-main"><div class="now-t">${esc(r.t)}</div>${r.d ? `<div class="now-d">${r.d}</div>` : ''}</div>
      ${r.pct != null ? `<div class="now-bar">${r.pct.toFixed(0)}%<div class="bar"><div style="width:${Math.min(100, r.pct)}%"></div></div></div>` : r.state === 'running' ? '<span class="dot running" style="align-self:center"></span>' : ''}
    </div>`).join('')}
  </div>`;
}

const achRow = (a, mini) => `<div class="ach ${a.unlocked ? a.tier : 'locked'} ${mini ? 'mini' : ''}"><div class="ic">${a.icon}</div>
  <div class="body"><div class="t">${esc(friendlyText(a.title))}</div><div class="d">${esc(friendlyText(a.desc))}</div></div>
  <div class="w">${a.unlocked ? `<span class="pos">✓ ${when(a.date)}</span>${a.main ? `<span class="wmain">${esc(short(a.main))}</span>` : ''}` : '🔒 not yet'}</div></div>`;

function renderGoals() {
  if (!ach) return '';
  const unlocked = ach.items.filter(a => a.unlocked).sort((a, b) => b.date - a.date);
  const locked = ach.items.filter(a => !a.unlocked);
  const next = ['rating', 'wins', 'matches'].map(c => locked.filter(a => a.cat === c).sort((a, b) => a.key - b.key)[0]).filter(Boolean);
  const done = unlocked.length, total = ach.items.length;
  return `<div class="two">
    <div><h2>Latest achievements <span class="sub" style="text-transform:none;letter-spacing:0">· ${done} of ${total} unlocked</span></h2>
      <div class="ach-list">${unlocked.slice(0, 3).map(a => achRow(a, true)).join('') || '<div class="empty">None yet.</div>'}</div></div>
    <div><h2>Next goals</h2><div class="ach-list">${next.map(a => achRow(a, true)).join('') || '<div class="empty">All goals reached!</div>'}</div></div>
  </div>
  <div style="margin-top:10px"><span class="help" data-go="achievements">See all achievements →</span></div>`;
}

function renderOverview(m) {
  return renderHero(m) + renderNow() + renderGoals();
}

// ---- Versions: the catalog in versions.ini, plus live ratings from every game played ----
function renderVersions(m) {
  const byAch = achByVersion();
  const rated = Object.fromEntries(m.pts.map(p => [p.key, p]));
  const inFile = new Set(catalog.map(c => c.name));
  // File order, then rated engines the file doesn't know about; planned versions always come last.
  const entries = catalog.map(c => ({ c, p: rated[c.name] || null }))
    .concat(m.pts.filter(p => !inFile.has(p.key)).map(p => ({ c: null, p })));
  const planned = e => e.c && e.c.status === 'planned';
  let list = entries.filter(e => !planned(e));
  if (ui.sort === 'rating') list.sort((a, b) => (b.p ? b.p.perf : -1) - (a.p ? a.p.perf : -1));
  list = list.concat(entries.filter(planned));
  if (!list.length) return `<h2>Versions</h2><div class="empty">No versions yet. Add them to versions.ini in the repository.</div>`;

  const lo = m.pts.length ? Math.floor((Math.min(...m.pts.map(p => p.perf - p.err)) - 25) / 100) * 100 : 0;
  const hi = m.pts.length ? Math.ceil((Math.max(...m.pts.map(p => p.perf + p.err)) + 25) / 100) * 100 : 1;
  const X = v => Math.max(0, Math.min(100, 100 * (v - lo) / (hi - lo)));
  const sub = t => `<h4 class="sub" style="font-size:12px;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.6px">${t}</h4>`;

  const card = ({ c, p }) => {
    const name = c ? c.name : p.key;
    const status = c ? c.status : '';
    const open = p && isOpen('ver:' + name);
    const mine = byAch[name] || [];
    const parentP = c && c.parent ? rated[c.parent] : null;
    const change = p && parentP ? p.perf - parentP.perf : null;
    const vs = p ? p.vs.filter(o => o.n >= 6).sort((a, b) => (b.anchor ?? -1) - (a.anchor ?? -1) || a.name.localeCompare(b.name)) : [];
    const scoreChip = o => { const s = pct(o.w, o.d, o.n); return `<span class="score ${s >= 55 ? 'good' : s <= 45 ? 'bad' : ''}">${esc(o.name)} <b>${s.toFixed(0)}%</b></span>`; };
    const ratingOf = o => o.anchor != null ? o.anchor.toFixed(0) : rated[o.name] ? rated[o.name].perf.toFixed(0) : '–';
    const barCls = status === 'failed' ? 'worse' : status === 'testing' ? 'same' : p && p.strongest ? 'best' : '';
    const row = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : '';
    const parentTxt = c && c.parent ? esc(c.parent) + (parentP ? ` <span class="sub">(${parentP.perf.toFixed(0)})</span>` : '') : '';
    let h = `<div class="vcard ${status === 'planned' ? 'planned' : ''} ${p && p.strongest ? 'is-best' : ''} ${status === 'failed' ? 'is-worse' : ''}">
      <div class="vtop" ${p ? `data-toggle="ver:${esc(name)}"` : ''}>
        <div style="min-width:0"><div class="vtitle">${esc(name)}${c && c.title ? `<span class="vtitle-sub">${esc(c.title)}</span>` : ''}</div>
          <div class="vchips">${c ? statusChip(status) : '<span class="chip">Not in versions.ini</span>'}
            ${p && p.live ? '<span class="chip info"><span class="dot running"></span>Games being played</span>' : p && p.provisional ? '<span class="chip">Few games so far</span>' : ''}
            ${p && p.strongest ? '<span class="chip best">★ Highest measured rating</span>' : ''}</div></div>
        <div class="vrate">${p ? `<b>${p.perf.toFixed(0)}</b><small>±${p.err.toFixed(0)} Elo · ${p.games} games</small>` : `<b class="sub">–</b><small>${status === 'planned' ? 'not built yet' : 'not rated yet'}</small>`}</div>
      </div>
      ${c && c.summary ? `<div class="vsum">${esc(c.summary)}</div>` : c ? '' : `<div class="vsum sub">This engine has been rated but is not described in versions.ini yet. Add a section with <code>engines = ${esc(name)}</code>.</div>`}
      ${buildBlock(name, !!p)}
      ${c ? `<dl class="vmeta">${row('Network', esc(c.network))}${row('Data', esc(c.data))}${row('Based on', parentTxt)}${row('Branch', c.branch ? `<code>${esc(c.branch)}</code>` : '')}${row('Date', esc(c.date))}</dl>` : ''}`;
    if (p) {
      h += `<div class="level">${levelText(p)}</div>
      <div class="scale ${barCls}"><div class="fill" style="width:${X(p.perf)}%"></div><div class="err" style="left:${X(p.perf - p.err)}%;width:${X(p.perf + p.err) - X(p.perf - p.err)}%"></div></div>
      <div class="scale-l"><span>${lo}</span><span>${hi}</span></div>
      <div class="vstats">
        ${change != null ? `<span><b class="${cls(change)}">${sign(change)}</b> Elo vs ${esc(c.parent)}</span>` : ''}
        <span><b>${p.games}</b> games</span>
        <span>first rated ${p.first ? when(p.first) : '–'}</span>
      </div>`;
    }
    if (mine.length) h += `<div class="vach">${mine.slice(0, open ? 99 : 6).map(a => `<span class="chip best" title="${esc(friendlyText(a.desc))}">${a.icon} ${esc(friendlyText(a.title))}</span>`).join('')}${!open && mine.length > 6 ? `<span class="chip">+${mine.length - 6} more</span>` : ''}</div>`;
    if (p) h += `<div class="vmore" data-toggle="ver:${esc(name)}">${open ? '▾ Hide results' : '▸ Show results against every opponent'}</div>`;
    if (open) {
      h += sub('Results, all tests combined') + `<div class="tbl"><table><tr><th>Opponent</th><th class="r">Won</th><th class="r">Drew</th><th class="r">Lost</th><th class="r">Score</th></tr>
        ${vs.map(o => `<tr><td>${esc(o.name)}<div class="sub" style="font-size:11px">rated ${ratingOf(o)} · ${o.n} games</div></td><td class="r">${o.w}</td><td class="r">${o.d}</td><td class="r">${o.l}</td><td class="r"><b>${pct(o.w, o.d, o.n).toFixed(0)}%</b></td></tr>`).join('') || '<tr><td colspan="5" class="sub">No games yet.</td></tr>'}
        </table></div>`;
      const ts = runs.filter(r => short(r.main) === name);
      if (ts.length) h += sub('Tournaments for this version') +
        ts.map(r => `<div class="now-row" data-go="tournaments" data-run="${esc(r.id)}"><div class="now-main"><div class="now-t">${esc(friendlyText(r.name))}</div><div class="now-d">${r.games}${r.total ? ' / ' + r.total : ''} games · ${r.status === 'running' ? 'running' : r.created ? when(r.created) : ''}${r.perf != null ? ' · measured ' + r.perf.toFixed(0) : ''}</div></div><span class="sub">›</span></div>`).join('');
      if (!mine.length) h += `<div class="sub" style="margin-top:12px">No achievements earned with this version yet.</div>`;
    } else if (vs.length) {
      h += `<div class="vach" style="margin-top:8px">${vs.slice(0, 5).map(scoreChip).join('')}</div>`;
    }
    return h + '</div>';
  };
  return `<h2>Engine versions</h2>
    <p class="lead">Each version of Pawnstorm, as described in versions.ini. Ratings are computed live from every game played; the bar shows the level on a shared scale (${lo}–${hi}) and the thin line is the margin of error.</p>
    <div class="toolbar"><span class="sub">Order</span>
      <button class="btn sm ${ui.sort !== 'rating' ? 'on' : ''}" data-set="sort:order">Version order</button>
      <button class="btn sm ${ui.sort === 'rating' ? 'on' : ''}" data-set="sort:rating">Strongest first</button></div>
    <div class="vlist">${list.map(card).join('')}</div>`;
}

// ---- Tournaments ----
function renderRun(r, b, compact) {
  if (!r) return `<h3><span class="dot ${b.status}"></span>${esc(friendlyText(b.name))}</h3><div class="sub" style="margin-top:8px">Loading…</div>`;
  b = r.brief; const s = r.summary;
  const pctDone = b.total ? Math.min(100, 100 * b.games / b.total) : 0;
  const eta = b.status === 'running' && b.games > 0 && b.total && !r.llr && b.type !== 'sprt' ? ' · about ' + dur(r.elapsed / b.games * (b.total - b.games)) + ' left' : '';
  const W = viewW() - 64;
  let html = compact ? '' : `<h3><span class="dot ${b.status}"></span>${esc(friendlyText(b.name))} <span class="pill">${esc(b.type)}</span></h3>`;
  html += `<div class="sub" style="margin-top:${compact ? 12 : 4}px">${esc(short(b.main))} · ${esc(b.tc)} per game · ${r.concurrency || '?'} games at a time · ${b.status === 'running' ? 'running for ' + dur(r.elapsed) : 'took ' + dur(r.elapsed)}${r.notes ? " · " + esc(friendlyText(r.notes)) : ""}</div>
    <div class="cards">
      <div class="card"><div class="k">Games played</div><div class="v">${b.games}${b.total ? `<span class="sub" style="font-size:.55em"> ${b.type === 'sprt' ? 'up to' : '/'} ${b.total}</span>` : ''}</div>
        <div class="d">${s.w} won · ${s.d} drawn · ${s.l} lost${eta}</div>${b.total && b.type !== 'sprt' ? `<div class="bar"><div style="width:${pctDone}%"></div></div>` : ''}</div>`;
  if (b.perf != null) html += `
      <div class="card"><div class="k">This test alone (rough)</div><div class="v">${b.perf.toFixed(0)} <span class="sub" style="font-size:.55em">±${b.perf_err.toFixed(0)}</span></div>
        <div class="d">${esc(short(b.main))}${b.derived ? ' · vs our earlier versions' : ' · vs Stockfish levels'}</div></div>`;
  html += `
      <div class="card"><div class="k">Ahead of opponents by</div><div class="v ${cls(s.elo)}">${fmtElo(s.elo, s.err)}</div>
        <div class="d">scored ${(s.score * 100).toFixed(0)}% · ${(s.los * 100).toFixed(0)}% chance it is truly stronger</div></div>`;
  if (r.llr) {
    const span = r.llr.hi - r.llr.lo, x = Math.max(0, Math.min(100, (r.llr.v - r.llr.lo) / span * 100));
    const verdict = b.verdict ? (b.verdict.includes('H1') ? '<span class="pos">Passed ✓</span>' : '<span class="neg">Failed ✗</span>') : 'Testing…';
    html += `
      <div class="card wide"><div class="k">Improvement test (SPRT)</div><div class="v">${verdict}</div>
        <div class="d">Confidence score ${r.llr.v.toFixed(2)} · it passes at ${r.llr.hi} and fails at ${r.llr.lo}</div><div class="llr"><div class="m" style="left:${x}%"></div></div>
        ${helpBlock('help:sprt:' + b.id, 'What is this?', '<b>SPRT</b> plays games until it is statistically confident that a change helps (or does not). The <b>confidence score (LLR)</b> moves right when the change looks better and left when it looks worse; reaching the right edge means the change is a proven improvement, the left edge means it is not.')}</div>`;
  }
  html += '</div>';
  if (r.problems.length) html += `<div class="warnbox">⚠ Problems: ${r.problems.map(p => `${p.count}× ${esc(p.kind)} (${esc(short(p.engine))})`).join(', ')}</div>`;
  if (r.live.length) html += `<h4>Games being played now (${r.live.length})</h4><div class="games">${r.live.map(liveGame).join('')}</div>`;
  if (r.series.length > 1) html += `<h4>How far ahead it is as games come in</h4><div class="chart">${eloChart(r.series, W)}</div>`;
  if (r.opponents.length) html += `<h4>Results against each opponent</h4><div class="tbl"><table>
    <tr><th>Opponent</th><th class="r">Won</th><th class="r">Drew</th><th class="r">Lost</th><th class="r">Score</th><th class="r">Elo diff</th></tr>
    ${r.opponents.map(o => `<tr><td>${esc(short(o.name))}<div class="sub" style="font-size:11px">${o.anchor != null ? 'rated ' + o.anchor + ' · ' : ''}${o.w + o.d + o.l} games</div></td>
      <td class="r">${o.w}</td><td class="r">${o.d}</td><td class="r">${o.l}</td><td class="r"><b>${(o.score * 100).toFixed(0)}%</b></td>
      <td class="r ${cls(o.elo)}">${fmtElo(o.elo, o.err)}</td></tr>`).join('')}
  </table></div>`;
  if (r.recent.length) html += `<h4>Recent games</h4><div class="tbl"><table>
    <tr><th>#</th><th>White</th><th>Black</th><th>Result</th><th>How</th><th class="r">Moves</th><th class="r">Duration</th></tr>
    ${r.recent.slice(0, compact ? 10 : 12).map(g => {
      const me = b.main, rc = (g.result === '1/2-1/2') ? 'res-d' : ((g.result === '1-0') === (g.white === me)) ? 'res-w' : 'res-l';
      const how = g.termination && g.termination !== 'normal' ? `<span class="neg">${esc(g.termination)}</span> ${esc(g.reason)}` : esc(g.reason);
      return `<tr><td>${g.n}</td><td>${esc(short(g.white))}</td><td>${esc(short(g.black))}</td><td class="${rc}">${esc(g.result)}</td><td>${how}</td><td class="r">${Math.ceil(g.plies / 2)}</td><td class="r">${esc(g.duration)}</td></tr>`;
    }).join('')}
  </table></div>`;
  return html;
}

const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
function boardHtml(fen, last) {
  let h = '';
  fen.split(' ')[0].split('/').forEach((row, r) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { for (let i = 0; i < +ch; i++) h += square(r, f++, null, last); }
      else h += square(r, f++, ch, last);
    }
  });
  return `<div class="board">${h}</div>`;
}
function square(r, f, p, last) {
  const name = 'abcdefgh'[f] + (8 - r);
  const hl = last && (last[0] === name || last[1] === name);
  const piece = p ? `<span class="pc ${p === p.toUpperCase() ? 'w' : 'b'}">${GLYPH[p.toLowerCase()]}︎</span>` : '';
  return `<div class="sq ${(r + f) % 2 ? 'd' : 'l'}${hl ? ' hl' : ''}">${piece}</div>`;
}
function liveGame(g) {
  const whitePct = 50 + 50 * (2 / (1 + Math.exp(-g.cp / 250)) - 1);
  const player = (name, t, to) => `<div class="player ${to ? 'to' : ''}"><span class="n">${to ? '<span class="dot running"></span>' : ''}${esc(short(name))}</span><span class="c">${clock(t)}</span></div>`;
  return `<div class="game">
    ${player(g.black, g.btime, g.thinking === g.black)}
    <div class="bw"><div class="evalbar"><div class="b" style="height:${100 - whitePct}%"></div><div class="w"></div></div>${boardHtml(g.fen, g.last)}</div>
    ${player(g.white, g.wtime, g.thinking === g.white)}
    <div class="ginfo"><span>Move <b>${g.move}</b></span><span>Eval <b>${esc(g.eval)}</b></span><span>Depth <b>${g.depth || '–'}</b></span></div>
  </div>`;
}

// ---- Championship tab: the latest round robin, with ratings fitted from its games alone ----
const latestChampionship = () => runs.filter(r => r.type === 'roundrobin').sort((a, b) => b.created - a.created)[0];
const CHAMP_NAMES = { stockfish: 'Stockfish 18 (full strength)', rubichess: 'RubiChess', dragon: 'Komodo Dragon', plentychess: 'PlentyChess' };
const champName = n => CHAMP_NAMES[n] || label(n);

function renderChampionship() {
  const rr = latestChampionship();
  if (!rr) return '<div class="empty">No championship has been played yet.</div>';
  const d = details[rr.id];
  if (!d || !d.fit) return '<div class="empty">Loading the championship…</div>';
  const running = rr.status === 'running';
  // Totals per engine from the crosstable.
  const tot = {};
  const cell = {};
  d.cross.forEach(([a, b, w, dr, l]) => {
    (tot[a] ??= [0, 0, 0]); (tot[b] ??= [0, 0, 0]);
    tot[a][0] += w; tot[a][1] += dr; tot[a][2] += l;
    tot[b][0] += l; tot[b][1] += dr; tot[b][2] += w;
    cell[a + '|' + b] = [w, dr, l]; cell[b + '|' + a] = [l, dr, w];
  });
  const fit = d.fit.slice().sort((a, b) => b.rating - a.rating);
  const games = rr.games || 0, total = rr.total || 0;
  const left = running && games > 20 ? d.elapsed / games * (total - games) : null;
  const p = total ? 100 * games / total : 0;

  // Rating ladder: bars with 95% error whiskers on a shared scale.
  const shown = fit.filter(f => f.err < 250);
  const lo = Math.min(...shown.map(f => f.rating - f.err)) - 20, hi = Math.max(...shown.map(f => f.rating + f.err)) + 20;
  const x = v => Math.max(0, Math.min(100, 100 * (v - lo) / (hi - lo)));
  const ladder = fit.map((f, i) => {
    const t = tot[f.name] || [0, 0, 0], n = t[0] + t[1] + t[2];
    const sc = n ? 100 * (t[0] + t[1] / 2) / n : null;
    const ours = isOurs(f.name);
    const bar = f.err < 250 ? `<div class="cl-track"><div class="cl-err" style="left:${x(f.rating - f.err)}%;width:${x(f.rating + f.err) - x(f.rating - f.err)}%"></div><div class="cl-dot ${ours ? 'ours' : ''}" style="left:${x(f.rating)}%"></div></div>` : `<div class="cl-track"><span class="sub" style="font-size:12px">far above everyone else</span></div>`;
    return `<tr class="${ours ? 'ours' : ''}"><td class="num">${i + 1}</td>
      <td><b>${esc(champName(f.name))}</b>${f.anchor ? ' <span class="pill">fixed anchor</span>' : ''}</td>
      <td class="num"><b>${f.rating.toFixed(0)}</b>${f.anchor ? '' : `<span class="sub"> ±${f.err.toFixed(0)}</span>`}</td>
      <td class="num">${sc == null ? '–' : sc.toFixed(1) + '%'}</td>
      <td class="num sub">${t[0]} / ${t[1]} / ${t[2]}</td>
      <td class="cl-bar">${bar}</td></tr>`;
  }).join('');

  // Crosstable: row engine's score against each column engine.
  const hdr = fit.map(f => `<th title="${esc(champName(f.name))}">${esc(champName(f.name).replace(/ \(full strength\)/, ''))}</th>`).join('');
  const rows = fit.map(r => `<tr class="${isOurs(r.name) ? 'ours' : ''}"><th class="rowh">${esc(champName(r.name))}</th>${fit.map(c => {
    if (c.name === r.name) return '<td class="xc diag">—</td>';
    const v = cell[r.name + '|' + c.name];
    if (!v) return '<td class="xc">·</td>';
    const n = v[0] + v[1] + v[2], s = n ? (v[0] + v[1] / 2) / n : 0.5;
    const tone = s >= 0.55 ? 'win' : s <= 0.45 ? 'loss' : 'even';
    return `<td class="xc ${tone}" style="--a:${Math.min(1, Math.abs(s - 0.5) * 2.2).toFixed(2)}" title="${esc(champName(r.name))} vs ${esc(champName(c.name))}: +${v[0]} =${v[1]} −${v[2]}">${(100 * s).toFixed(0)}%<span>${n}</span></td>`;
  }).join('')}</tr>`).join('');

  return `<div class="panel run">
    <h3><span class="dot ${running ? 'running' : 'finished'}"></span>${esc(friendlyText(rr.name))} <span class="pill">round robin</span> <span class="pill">${esc(rr.tc || '10+0.1')}</span> <span class="pill">${running ? 'running' : 'finished'}</span></h3>
    <div class="sub" style="margin-top:4px">${esc(d.notes || '')}</div>
    <div class="cards">
      <div class="card wide"><div class="k">Games played</div><div class="v">${games.toLocaleString()} <span class="sub" style="font-size:.55em">/ ${total.toLocaleString()} · ${p.toFixed(1)}%</span></div>
        <div class="d">${left != null ? 'about ' + dur(left) + ' left' : running ? 'starting…' : 'finished'} · ${d.concurrency} games at a time</div><div class="bar big"><div style="width:${p}%"></div></div></div>
      <div class="card"><div class="k">Leader</div><div class="v" style="font-size:18px;margin-top:6px">${esc(champName(fit[0].name))}</div><div class="d">${fit[0].rating.toFixed(0)} rating in this event</div></div>
      <div class="card"><div class="k">Best Pawnstorm</div>${(() => { const b = fit.find(f => isOurs(f.name)); return b ? `<div class="v" style="font-size:18px;margin-top:6px">${esc(champName(b.name))}</div><div class="d">${b.rating.toFixed(0)} ±${b.err.toFixed(0)}</div>` : '<div class="v">–</div>'; })()}</div>
    </div>
    <h4>Standings</h4>
    <p class="lead" style="margin:0 0 10px">Ratings here come only from this event's games, with Elo-limited Stockfish fixed at its setting as the anchor. The bar shows each rating with its 95% range: where two ranges overlap, the order between them isn't settled yet. More games narrow them.</p>
    <div class="cl-wrap"><table class="cl"><thead><tr><th>#</th><th>Engine</th><th class="num">Rating</th><th class="num">Score</th><th class="num">W / D / L</th><th></th></tr></thead><tbody>${ladder}</tbody></table></div>
    <h4>Head to head</h4>
    <p class="lead" style="margin:0 0 10px">Each cell is the row engine's score against the column engine (small number = games played). Green: row engine ahead, red: behind.</p>
    <div class="cl-wrap"><table class="xt"><thead><tr><th></th>${hdr}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function renderTournaments() {
  const live = runs.filter(r => r.status === 'running');
  const done = runs.filter(r => r.status !== 'running');
  let h = `<h2>In progress (${live.length})</h2>` +
    (live.length ? live.map(r => `<div class="panel run">${renderRun(details[r.id], r)}</div>`).join('') : '<div class="empty">Nothing is running right now.</div>');
  h += `<h2>Finished (${done.length})</h2><p class="lead">Tap a tournament to see its results, games and charts.</p>`;
  h += done.map(r => {
    const open = isOpen('run:' + r.id);
    const score = r.elo == null ? null : 100 / (1 + Math.pow(10, -r.elo / 400));
    const res = r.verdict
      ? (r.verdict.includes('H1') ? '<span class="chip good">Passed</span>' : '<span class="chip bad">Failed</span>')

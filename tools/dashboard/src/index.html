      : r.status === 'stopped' ? '<span class="chip warn">Stopped</span>' : '';
    return `<div class="trow"><div class="trow-top" data-toggle="run:${esc(r.id)}"><span class="chev2">${open ? '▾' : '▸'}</span>
      <div class="trow-main"><b>${esc(friendlyText(r.name))}</b> <span class="pill">${esc(r.type)}</span>
        <div class="sub" style="font-size:13px">${r.created ? when(r.created) : ''} · ${r.games} games${score != null ? ` · scored ${score.toFixed(0)}%` : ''}</div></div>
      <div class="trow-res">${res}</div></div>
      ${open ? `<div class="trow-body">${renderRun(details[r.id], r, true)}</div>` : ''}</div>`;
  }).join('') || '<div class="empty">No finished tournaments yet.</div>';
  return h;
}

// ---- Achievements ----
const CATEGORIES = [['rating', 'Rating milestones'], ['wins', 'First wins'], ['matches', 'Match victories'], ['sprt', 'Proven improvements'], ['games', 'Games played']];

function renderAchievements(m) {
  if (!ach) return '<div class="empty">Loading…</div>';
  const total = ach.items.length, got = ach.items.filter(a => a.unlocked);
  const group = (title, items, sub, keepCase) => items.length ? `<h2>${keepCase ? `<span style="text-transform:none">${esc(title)}</span>` : esc(title)} <span class="sub" style="text-transform:none;letter-spacing:0">· ${sub ?? items.filter(a => a.unlocked).length + ' of ' + items.length}</span></h2><div class="ach-list">${items.map(a => achRow(a)).join('')}</div>` : '';
  let body;
  if (ui.group === 'version') {
    const by = achByVersion();
    const order = m.pts.slice().reverse();
    body = order.filter(p => by[p.key]).map(p => group(p.short, by[p.key].sort((a, b) => b.date - a.date), `${by[p.key].length} earned · ${p.perf.toFixed(0)} rating`, true)).join('') +
      group('Still locked', ach.items.filter(a => !a.unlocked).sort((a, b) => a.cat.localeCompare(b.cat) || a.key - b.key), ach.items.filter(a => !a.unlocked).length + ' goals');
  } else {
    body = group('Recently unlocked', got.slice().sort((a, b) => b.date - a.date).slice(0, 5), 'newest first') +
      CATEGORIES.map(([cat, label]) => {
        const items = ach.items.filter(a => a.cat === cat).sort((a, b) => a.key - b.key);
        // "Proven improvements" needs an SPRT test, which only exists once one has been run.
        const note = cat === 'sprt' && !items.some(a => a.unlocked) ? 'none unlocked yet · needs a head-to-head SPRT test of a change' : undefined;
        return group(label, items, note);
      }).join('');
  }
  return `<div class="panel" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <div><div class="rating-label">Achievements unlocked</div><div class="rating" style="font-size:44px">${got.length}<small> / ${total}</small></div></div>
      <div style="flex:1;min-width:160px"><div class="bar big"><div style="width:${100 * got.length / Math.max(1, total)}%"></div></div></div>
    </div>
    <div class="toolbar" style="margin-top:16px"><span class="sub">Group by</span>
      <button class="btn sm ${ui.group === 'cat' ? 'on' : ''}" data-set="group:cat">Type</button>
      <button class="btn sm ${ui.group === 'version' ? 'on' : ''}" data-set="group:version">Engine version</button></div>` + body;
}

// ---- Lab ----
function section(id, title, summary, body, defOpen) {
  const open = isOpen(id, defOpen);
  return `<h2 class="sec" data-toggle="${id}" data-def="${defOpen ? 1 : 0}"><span class="chev">${open ? '▾' : '▸'}</span>${esc(title)}${!open && summary ? `<span class="secsum"> · ${summary}</span>` : ''}</h2>${open ? body : ''}`;
}

function renderCloud(g) {
  if (g.state === 'queued') {
    return `<div class="panel run"><h3><span class="dot stopped"></span>Cloud batch ${esc(g.run_id)} <span class="pill">GitHub Actions</span> <span class="pill">queued</span></h3>
      <div class="sub" style="margin-top:4px">Waiting for the current batch to finish (only one batch runs at a time) · <a href="${esc(g.url)}" target="_blank" rel="noopener">view on GitHub</a></div></div>`;
  }
  const running = g.state === 'running';
  const total = g.jobs_total || 0, got = g.jobs_downloaded || 0;
  const elapsed = (running ? g.now : g.updated) - g.started;
  const planned = (g.minutes || 330) * 60 + 300;
  const p = running ? Math.min(99, 100 * elapsed / planned) : 100;
  // Real numbers once a job's data is downloaded; until then an estimate from earlier batches
  // of the same kind (cloud-sync.ps1 writes est_per_job).
  const measured = got ? g.positions / got : null;
  const perJob = measured || g.est_per_job || null;
  const projected = perJob ? perJob * total : null;
  const rate = perJob ? perJob * total / ((g.minutes || 330) * 60) : null;
  const soFar = running && perJob ? Math.round(perJob * total * Math.min(1, elapsed / ((g.minutes || 330) * 60))) : null;
  const kind = ({ 1: 'gen1 (classical eval)', 2: 'gen2 (v0.8 network)', 3: 'gen3 (v1.3 network)' })[g.gen || (g.eval === 'nnue' ? 2 : 1)] || 'gen' + g.gen;
  const state = running ? 'running' : 'finished';
  return `<div class="panel run">
    <h3><span class="dot ${state}"></span>Cloud batch ${esc(g.run_id)} <span class="pill">GitHub Actions</span> <span class="pill">${state}</span></h3>
    <div class="sub" style="margin-top:4px">${kind} · ${total} jobs × ${g.minutes || 330} min · ${esc(g.cpu || 'cloud runners')} · <a href="${esc(g.url)}" target="_blank" rel="noopener">view on GitHub</a></div>
    ${g.warning ? `<div class="warnbox">⚠ ${esc(g.warning)}</div>` : ''}
    <div class="cards">
      <div class="card wide"><div class="k">Batch progress</div>
        <div class="v">${running ? dur(Math.max(0, planned - elapsed)) + '<span class="sub" style="font-size:.55em"> left</span>' : 'done'}</div>
        <div class="d">${g.jobs_running || 0} running · ${g.jobs_queued || 0} queued · ${g.jobs_done || 0} finished${g.jobs_failed ? ` · <span class="neg">${g.jobs_failed} failed</span>` : ''}</div>
        <div class="bar big"><div style="width:${p}%"></div></div></div>
      ${soFar != null ? `<div class="card"><div class="k">Generated so far (est.)</div><div class="v">~${big(soFar)}</div>
        <div class="d">downloads when the jobs finish</div></div>` : ''}
      <div class="card"><div class="k">Positions downloaded</div><div class="v">${big(g.positions || 0)}</div>
        <div class="d">${got}/${total} jobs' data on this PC</div></div>
      <div class="card"><div class="k">Expected from batch</div><div class="v">${projected ? '~' + big(Math.round(projected)) : '–'}</div>
        <div class="d">${rate ? '≈ ' + big(Math.round(rate * 3600)) + ' / hour' + (measured ? '' : ' (estimate from earlier batches)') : 'known once the first job finishes'}</div></div>
      <div class="card"><div class="k">Data on disk</div><div class="v">${(g.bytes / 1e9).toFixed(2)}<span class="sub" style="font-size:.55em"> GB</span></div><div class="d">gzipped text</div></div>
    </div></div>`;
}

function renderLocalGen(g) {
  const running = g.state === 'running' && g.now - g.updated < 15;
  const state = g.state === 'finished' ? 'finished' : running ? 'running' : 'stopped';
  const p = Math.min(100, 100 * g.positions / g.target);
  const left = running && g.rate > 0 ? dur((g.target - g.positions) / g.rate) : null;
  const wdl = g.white_wins + g.draws + g.black_wins || 1;
  const nps = g.nodes / Math.max(1, g.updated - g.started);
  return `<div class="panel run">
    <h3><span class="dot ${state}"></span>Self-play on this PC: ${esc(g.name)} <span class="pill">${state}</span></h3>
    <div class="sub" style="margin-top:4px">${g.threads} CPU threads · ${big(g.soft_nodes)} nodes per move · running for ${dur((running ? g.now : g.updated) - g.started)}</div>
    <div class="cards">
      <div class="card wide"><div class="k">Training positions</div>
        <div class="v">${big(g.positions)} <span class="sub" style="font-size:.55em">/ ${big(g.target)} · ${p.toFixed(1)}%</span></div>
        <div class="d">${left ? '~' + left + ' left' : state}</div><div class="bar big"><div style="width:${p}%"></div></div></div>
      <div class="card"><div class="k">Speed</div><div class="v">${big(Math.round(g.rate || 0))}<span class="sub" style="font-size:.55em"> pos/s</span></div><div class="d">${big(Math.round(nps))} nodes/s searched</div></div>
      <div class="card"><div class="k">Games played</div><div class="v">${big(g.games)}</div><div class="d">avg ${(g.plies / Math.max(1, g.games)).toFixed(0)} plies · ${(g.positions / Math.max(1, g.games)).toFixed(0)} kept per game</div></div>
      <div class="card"><div class="k">Results (white / draw / black)</div><div class="v" style="font-size:18px;margin-top:6px">${(100 * g.white_wins / wdl).toFixed(0)}% / <span class="sub">${(100 * g.draws / wdl).toFixed(0)}%</span> / ${(100 * g.black_wins / wdl).toFixed(0)}%</div></div>
      <div class="card"><div class="k">Data on disk</div><div class="v">${(g.bytes / 1e9).toFixed(2)}<span class="sub" style="font-size:.55em"> GB</span></div><div class="d">text, converted for training later</div></div>
    </div></div>`;
}

// A generator counts as running while its status file is fresh: every few seconds for this PC,
// every sync for the Oracle server (oracle-sync.ps1), always for GitHub (its jobs report on completion).
function genRunning(g) {
  if (g.state !== 'running') return false;
  if (g.source === 'cloud') return true;
  if (g.source === 'oracle') return g.now - g.updated < 2 * (g.sync_every || 600) + 60;
  return g.now - g.updated < 15;
}

function renderOracle(g) {
  const running = genRunning(g);
  const state = running ? 'running' : 'stopped';
  const wdl = g.white_wins + g.draws + g.black_wins || 1;
  return `<div class="panel run">
    <h3><span class="dot ${state}"></span>Oracle Cloud server <span class="pill">always on</span> <span class="pill">${state}</span></h3>
    <div class="sub" style="margin-top:4px">${esc(g.host || 'Oracle Cloud ARM')} · ${big(g.soft_nodes)} nodes per move · keeps generating when this PC is off; data is collected every ${Math.round((g.sync_every || 600) / 60)} minutes</div>
    <div class="cards">
      <div class="card wide"><div class="k">Positions collected on this PC</div>
        <div class="v">${big(g.positions)}</div>
        <div class="d">+ ${big(g.pending || 0)} in the hour-long chunk being generated now</div></div>
      <div class="card"><div class="k">Speed</div><div class="v">${big(g.rate_h || 0)}<span class="sub" style="font-size:.55em"> / hour</span></div><div class="d">${g.threads} cores</div></div>
      <div class="card"><div class="k">Games played</div><div class="v">${big(g.games)}</div><div class="d">in collected chunks</div></div>
      <div class="card"><div class="k">Results (white / draw / black)</div><div class="v" style="font-size:18px;margin-top:6px">${(100 * g.white_wins / wdl).toFixed(0)}% / <span class="sub">${(100 * g.draws / wdl).toFixed(0)}%</span> / ${(100 * g.black_wins / wdl).toFixed(0)}%</div></div>
    </div></div>`;
}

function renderDatagen() {
  const totalPos = gens.reduce((s, g) => s + (g.positions || 0), 0);
  const stopped = gens.find(g => g.cloud_stopped);
  const isCloud = g => g.source === 'cloud';
  const recent = gens.filter(g => !isCloud(g) || g.state === 'running' || g.state === 'queued');
  const olderAll = gens.filter(g => isCloud(g) && g.state !== 'running' && g.state !== 'queued');
  // The newest finished cloud batch stays visible; the rest are summarised.
  const newest = olderAll.slice().sort((a, b) => b.started - a.started)[0];
  const older = olderAll.filter(g => g !== newest);
  const runningN = gens.filter(genRunning).length;
  const sum = `${big(totalPos)} positions · ${runningN ? runningN + ' generator' + (runningN > 1 ? 's' : '') + ' running' : 'idle'}`;
  let body = `<p class="lead">The engine plays games against itself; each position, with the result, becomes training data for the next neural network. More (and better) data makes a stronger engine.</p>`;
  if (stopped) body += `<div class="warnbox" style="margin-bottom:12px">⛔ Cloud generation stopped because GitHub reported: ${esc(stopped.cloud_stopped)}</div>`;
  body += recent.map(g => isCloud(g) ? renderCloud(g) : g.source === 'oracle' ? renderOracle(g) : renderLocalGen(g)).join('');
  if (newest) body += renderCloud(newest);
  if (older.length) {
    const pos = older.reduce((s, g) => s + (g.positions || 0), 0), failed = older.reduce((s, g) => s + (g.jobs_failed || 0), 0);
    const open = isOpen('older-cloud');
    body += `<div class="panel run"><div class="now-row" data-toggle="older-cloud" style="border:0"><span class="chev2">${open ? '▾' : '▸'}</span><div class="now-main"><div class="now-t">${older.length} earlier cloud batch${older.length > 1 ? 'es' : ''}</div><div class="now-d">${big(pos)} positions in total${failed ? ' · ' + failed + ' failed jobs' : ''}</div></div></div></div>`;
    if (open) body += older.sort((a, b) => b.started - a.started).map(renderCloud).join('');
  }
  return gens.length ? section('sec:datagen', 'Training data', sum, body, true) : '';
}

// ---- Version build pipeline: prepare the data (3 steps) -> train on the GPU -> rating tournament ----
const PREP_STAGE = { snapshot: 'collecting positions from every data source', convert: 'converting positions to the trainer’s format', shuffle: 'shuffling the positions' };
const PREP_STEPS = ['Collect', 'Convert', 'Shuffle'];
/// "net-v0.8.1-316m" -> "v0.8.1" (the catalog name); other net names give ''.
const netVersion = n => { const m = String(n).match(/^net-(v\d+(?:\.\d+)*[a-z]?)-/i); return m ? short(m[1]) : ''; };

/// Speed of the preparation step, measured between polls.
function trackPrep(p) {
  const prev = prepRate[p.name];
  if (prev && prev.stage === p.stage && p.now > prev.t && p.bytes >= prev.bytes) {
    const inst = (p.bytes - prev.bytes) / (p.now - prev.t);
    p.rate = prev.rate == null ? inst : prev.rate * 0.8 + inst * 0.2;
  } else p.rate = prev && prev.stage === p.stage ? prev.rate : null;
  if (!prev || p.now > prev.t || prev.stage !== p.stage) prepRate[p.name] = { t: p.now, bytes: p.bytes, rate: p.rate, stage: p.stage };
}
function prepView(p) {
  const pct = p.total ? Math.min(99, 100 * p.bytes / p.total) : null;
  const left = p.rate > 0 && p.total ? dur((p.total - p.bytes) / p.rate) : null;
  return { pct, left, idle: p.now - p.updated };
}
function trainProg(t) {
  const done = t.end_sb ? Math.max(0, t.sb - 1 + (t.pct >= 100 ? 1 : t.pct / 100)) : 0;
  const pct = t.end_sb ? Math.min(100, 100 * done / t.end_sb) : 0;
  const perSb = t.losses.length ? t.total_time / t.losses.length : null;
  const left = t.state === 'running' && perSb ? dur(perSb * (t.end_sb - done)) : null;
  return { done, pct, left };
}

function prepCard(p) {
  const v = netVersion(p.name), q = prepView(p), stalled = q.idle > 900;
  return `<div class="panel run">
    <h3><span class="dot ${stalled ? 'stopped' : 'running'}"></span>Preparing training data${v ? ' for ' + esc(v) : ''} <span class="pill">step ${p.step} of 3</span></h3>
    <div class="sub" style="margin-top:4px">${esc(p.name)}${p.positions ? ' · about ' + Math.round(p.positions / 1e6) + 'M positions' : ''}</div>
    <div class="vchips" style="margin-top:10px">${PREP_STEPS.map((s, i) => `<span class="chip ${i + 1 < p.step ? 'good' : i + 1 === p.step ? 'info' : ''}">${i + 1 < p.step ? '✓' : i + 1} ${s}</span>`).join('')}</div>
    ${stalled ? `<div class="warnbox">No progress for ${dur(q.idle)}. Check that the preparation is still running.</div>` : ''}
    <div class="cards">
      <div class="card wide"><div class="k">Step ${p.step}: ${PREP_STAGE[p.stage]}</div>
        <div class="v">${q.pct == null ? '–' : q.pct.toFixed(0) + '%'}<span class="sub" style="font-size:.55em">${q.left ? ' · about ' + q.left + ' left' : ''}</span></div>
        <div class="d">${(p.bytes / 1e9).toFixed(1)} GB${p.total ? ' of about ' + (p.total / 1e9).toFixed(1) + ' GB' : ''}</div>
        ${q.pct != null ? `<div class="bar big"><div style="width:${q.pct}%"></div></div>` : ''}</div>
      <div class="card"><div class="k">Speed</div><div class="v">${p.rate > 0 ? (p.rate / 1e6).toFixed(0) : '–'}<span class="sub" style="font-size:.55em"> MB/s</span></div><div class="d">measured between refreshes</div></div>
      <div class="card"><div class="k">Next</div><div class="v" style="font-size:16px">Training starts by itself</div><div class="d">then the new version is rated in a tournament</div></div>
    </div>
    ${helpBlock('help:prep', 'What is this step?', 'Before a network can be trained, the self-play positions from every data source are <b>collected</b> into one file, <b>converted</b> to the compact format the trainer reads, and <b>shuffled</b> so training sees them in random order. The GPU is idle until this finishes.')}
  </div>`;
}

/// What the build of one version is doing right now (shown on its card on the Versions tab).
function buildBlock(name, rated) {
  const bar = p => p != null ? `<div class="bar"><div style="width:${p}%"></div></div>` : '';
  let h = '';
  preps.filter(x => netVersion(x.name) === name).forEach(x => {
    const q = prepView(x);
    h += `<div class="vbuild"><b>📦 Preparing training data</b> · step ${x.step} of 3, ${PREP_STAGE[x.stage]}${q.pct != null ? ' · ' + q.pct.toFixed(0) + '%' : ''}${q.left ? ' · about ' + q.left + ' left' : ''}${bar(q.pct)}</div>`;
  });
  const mine = trains.filter(t => netVersion(t.net || t.name) === name);
  mine.filter(t => t.state === 'running').forEach(t => {
    const g = trainProg(t);
    h += `<div class="vbuild"><b>🧠 Training the network</b> · round ${t.sb || 0} of ${t.end_sb}${g.left ? ' · about ' + g.left + ' left' : ''}${bar(g.pct)}</div>`;
  });
  if (!h && !rated && mine.some(t => t.state === 'finished')) h = `<div class="vbuild"><b>✓ Network trained</b> · waiting for its rating tournament</div>`;
  return h;
}

function trainCard(t) {
  const { pct: p, left } = trainProg(t);
  const tv = netVersion(t.net || t.name);
  const last = t.losses.length ? t.losses[t.losses.length - 1][1] : null;
  const dotState = t.state === 'running' ? 'running' : t.state === 'finished' ? 'finished' : 'stopped';
  return `<div class="panel run">
    <h3><span class="dot ${dotState}"></span>Training${tv ? " " + esc(tv) : ""}: ${esc(t.net || t.name)} <span class="pill">${esc(t.state)}</span></h3>
    <div class="sub" style="margin-top:4px">${esc(t.device || 'starting…')}${t.started ? ' · started ' + when(t.started) : ''}</div>
    ${t.state === 'failed' ? `<div class="warnbox">Training failed: ${esc(t.error)}</div>` : ''}
    <div class="cards">
      <div class="card wide"><div class="k">Progress</div>
        <div class="v">${t.sb || 0}<span class="sub" style="font-size:.55em"> / ${t.end_sb} rounds · ${p.toFixed(1)}%</span></div>
        <div class="d">${left ? '~' + left + ' left' : esc(t.state)}${t.pct < 100 && t.state === 'running' ? ` · current round ${t.pct.toFixed(0)}%` : ''}</div>
        <div class="bar big"><div style="width:${p}%"></div></div></div>
      <div class="card"><div class="k">GPU speed</div><div class="v">${big(Math.round(t.pos_s))}<span class="sub" style="font-size:.55em"> pos/s</span></div><div class="d">positions trained per second</div></div>
      <div class="card"><div class="k">Loss</div><div class="v">${last == null ? '–' : last.toFixed(5)}</div><div class="d">lower = closer fit to the data</div></div>
    </div>
    ${t.losses.length > 1 ? `<h4>Loss by training round</h4><div class="chart">${lossChart(t.losses, viewW() - 64)}</div>` : ''}
  </div>`;
}

// ---- Automatic jobs (/api/schedule: scripts that train and rate versions on a schedule) ----
const hm = t => new Date(t * 1000).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
const jobs = () => Array.isArray(schedule) ? schedule : [];
const JOB_ORDER = { training: 0, preparing: 0, testing: 1, waiting: 2, stopped: 3, failed: 4, done: 5 };
const nextJob = () => jobs().filter(j => !['done', 'failed', 'stopped'].includes(j.state)).sort((a, b) => (JOB_ORDER[a.state] - JOB_ORDER[b.state]) || (a.start - b.start))[0];
const JOB_LABEL = { waiting: 'scheduled', preparing: 'preparing data', training: 'training', testing: 'testing', done: 'done', failed: 'failed', stopped: 'stopped' };

function renderSchedule() {
  const list = jobs().slice().sort((a, b) => (JOB_ORDER[a.state] - JOB_ORDER[b.state]) || (a.start - b.start));
  if (!list.length) return `<div class="panel run"><h3>📅 Automatic jobs</h3><div class="sub" style="margin-top:4px">Nothing is scheduled. New versions are set up to train and test themselves when there is enough new data; ask Claude to schedule one.</div></div>`;
  const rows = list.map(j => {
    const dot = j.state === 'done' ? 'finished' : ['failed', 'stopped'].includes(j.state) ? 'stopped' : j.state === 'waiting' ? 'idle' : 'running';
    const when = j.state === 'waiting' && j.start ? `starts at ${hm(j.start)}${j.start > Date.now() / 1000 ? ' (in ' + dur(j.start - Date.now() / 1000) + ')' : ''}` : j.state === 'stopped' ? 'its script stopped running (e.g. the PC restarted); ask Claude to restart it' : `updated ${hm(j.updated)}`;
    return `<div class="now-row" style="cursor:default"><span class="dot ${dot}" style="margin-top:7px"></span><div class="now-main">
      <div class="now-t">${esc(friendlyText(j.title))} <span class="pill">${JOB_LABEL[j.state] || esc(j.state)}</span></div>
      <div class="now-d">${esc(friendlyText(j.detail))}${j.detail ? ' · ' : ''}${when}</div></div></div>`;
  }).join('');
  return `<div class="panel run"><h3>📅 Automatic jobs</h3>
    <div class="sub" style="margin-top:4px">Versions that train and test themselves on a schedule, so the lab keeps working while nobody is at the PC.</div>${rows}</div>`;
}

function renderTraining() {
  const running = trains.filter(t => t.state === 'running');
  const rest = trains.filter(t => t.state !== 'running');
  const latest = rest[0];
  const older = rest.slice(1);
  const prepNames = preps.map(p => netVersion(p.name) || p.name).join(', ');
  const sum = running.length ? 'training now' : preps.length ? 'preparing data for ' + esc(prepNames) : 'idle' + (nextJob() ? ' · next: ' + esc(nextJob().title) + (nextJob().start > Date.now() / 1000 ? ' at ' + hm(nextJob().start) : '') : '');
  let body = `<p class="lead">A new version starts with its training data being prepared, then a neural network is trained on it using the graphics card. When it finishes, it becomes an engine version that is rated in a tournament.</p>` + renderSchedule();
  body += preps.map(prepCard).join('') + running.map(trainCard).join('') + (latest ? trainCard(latest) : '');
  if (older.length) {
    const open = isOpen('older-train');
    body += `<div class="panel run"><div class="now-row" data-toggle="older-train" style="border:0"><span class="chev2">${open ? '▾' : '▸'}</span><div class="now-main"><div class="now-t">${older.length} earlier training run${older.length > 1 ? 's' : ''}</div></div></div></div>`;
    if (open) body += older.map(trainCard).join('');
  }
  return section('sec:training', 'Neural network training (GPU)', sum, body, running.length > 0 || preps.length > 0);
}

function renderHealth() {
  const h = health;
  if (!h || !h.updated) return section('sec:health', 'System health', 'watchdog not running', `<div class="warnbox">The watchdog isn't running, so temperatures aren't being monitored.</div>`, true);
  const stale = h.now - h.updated > 30;
  const lim = k => (String(h['limit_' + k] || '').split(',').map(Number));
  const tile = (label, v, unit, key, sub, low) => {
    let c = '';
    if (v != null && v !== '' && key) {
      const [w, cr] = lim(key);
      const bad = low ? v <= cr : v >= cr, warn = low ? v <= w : v >= w;
      c = bad ? 'neg' : warn ? 'warnc' : 'pos';
    }
    return `<div class="card"><div class="k">${label}</div><div class="v ${c}">${v == null || v === '' ? '–' : v}<span class="sub" style="font-size:.55em">${unit}</span></div><div class="d">${sub}</div></div>`;
  };
  const states = {
    ok: ['pos', '✓ All good: everything within safe limits'],
    warn: ['warnc', '⚠ Data generation paused: ' + h.reason],
    critical: ['neg', '⛔ Everything paused: ' + h.reason],
    manual: ['warnc', '⏸ Everything paused by you'],
  };
  const [sc, st] = stale ? ['neg', 'Watchdog stopped responding'] : states[h.level] || ['', h.level];
  const lims = k => { const [w, c] = lim(k); return `pause at ${w} · stop all at ${c}`; };
  const paused = h.level === 'manual' || h.level === 'warn' || h.level === 'critical';
  let body = `<div class="panel run">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div class="${sc}" style="font-weight:700;font-size:15px;flex:1;min-width:200px">${esc(st)}</div>
      ${paused ? `<button class="btn" data-act="resume">▶ Resume</button>` : `<button class="btn" data-act="pause">⏸ Pause everything</button>`}
    </div>
    ${h.warn_now && h.level === 'ok' ? `<div class="sub" style="margin-top:6px">Watching: ${esc(h.warn_now)}</div>` : ''}
    <div class="cards">
      ${tile('CPU temperature', h.cpu_temp, '°C', 'cpu_temp', `${h.cpu_power ?? '–'} W · ${h.cpu_load ?? '–'}% load · ${lims('cpu_temp')}`)}
      ${tile('GPU temperature', h.gpu_temp, '°C', 'gpu_temp', `${h.gpu_power ?? '–'} W · ${h.gpu_load ?? '–'}% load · ${lims('gpu_temp')}`)}
      ${tile('GPU memory', h.gpu_mem_temp, '°C', 'gpu_mem_temp', `${h.gpu_mem_used_gb ?? '–'} GB VRAM in use`)}
      ${tile('SSD temperature', h.ssd_temp, '°C', 'ssd_temp', lims('ssd_temp'))}
      ${tile('Free RAM', h.ram_free_gb, ' GB', 'ram_free_gb', `of ${h.ram_total_gb} GB`, true)}
      ${tile('Free disk (C:)', h.disk_free_gb, ' GB', 'disk_free_gb', 'data + checkpoints live here', true)}
    </div>`;
  if (h.history.length > 2) body += `<h4>Temperatures, last hour</h4><div class="chart">${tempChart(h.history, viewW() - 64)}</div>`;
  if (h.events.length) body += `<h4>Watchdog log</h4><div class="tbl" style="padding:6px 12px;font-size:12px;font-family:Consolas,monospace;line-height:1.7;overflow-wrap:anywhere">${h.events.map(e => `<div class="${/CRITICAL/.test(e) ? 'neg' : /WARNING|pause/.test(e) ? 'warnc' : 'sub'}">${esc(e)}</div>`).join('')}</div>`;
  body += '</div>';
  const bad = stale || h.level !== 'ok';
  return section('sec:health', 'System health', `${h.level === 'ok' && !stale ? '✓ all good' : esc(stale ? 'not responding' : h.level)} · CPU ${h.cpu_temp ?? '–'}°C · GPU ${h.gpu_temp ?? '–'}°C`, body, bad);
}

function renderLab() {
  if (!lab) return '<div class="empty">Loading…</div>';
  const parts = [['datagen', 'Data generation on this PC'], ['watchdog', 'Watchdog (temperature safety)'], ['cloud_sync', 'Cloud sync (downloads GitHub data)'], ['oracle_sync', 'Oracle sync (collects data from the Oracle server)']];
  const on = parts.filter(([k]) => lab[k]).length;
  const status = lab.busy ? (lab.busy === 'start' ? 'Starting…' : 'Stopping…') : on === parts.length ? 'Everything is running' : on === 0 ? 'The lab is stopped' : `Partly running (${on} of ${parts.length})`;
  const top = `<div class="panel run">
    <div class="now-head"><h3>${esc(status)}</h3><div style="display:flex;gap:6px;flex-wrap:wrap">${labControls()}</div></div>
    ${parts.map(([k, n]) => `<div class="now-row" style="cursor:default"><span class="dot ${lab[k] ? 'running' : 'stopped'}"></span><div class="now-main"><div class="now-t" style="${lab[k] ? '' : 'color:var(--muted);font-weight:500'}">${n}</div></div><span class="sub">${lab[k] ? 'on' : 'off'}</span></div>`).join('')}
    ${lab.log && lab.log.length && lab.log_time && Date.now() / 1000 - lab.log_time < 6 * 3600 ? `<div class="sub" style="margin-top:10px;font-size:12px;white-space:pre-wrap">Last start/stop from the dashboard (${when(lab.log_time)}):\n${esc(lab.log.join('\n'))}</div>` : ''}
  </div>`;
  return `<h2 style="margin-top:4px">Lab</h2>` + top + renderHealth() + renderDatagen() + renderTraining();
}

// ---- Actions (POST + custom header, which other websites can't send to this server) ----
const post = url => fetch(url, { method: 'POST', headers: { 'X-Lab': '1' } }).catch(() => {});

async function doAction(what) {
  if (what === 'pause') {
    if (!confirm('Pause data generation, GPU training and tournaments now?\n(Tournament games in progress may be lost on time.)')) return;
    await post('/api/control/pause');
  } else if (what === 'resume') {
    await post('/api/control/resume');
  } else if (what === 'lab-start') {
    await post('/api/lab/start');
  } else if (what === 'lab-stop') {
    if (!confirm('Stop the lab?\n\nData generation pauses (it resumes where it left off), any tournament in progress is cut short (finished games are kept), and the watchdog and cloud/Oracle sync stop (the Oracle server keeps generating). Automatic training jobs keep their schedule. The dashboard stays open.')) return;
    const cloud = confirm('Also start a cloud batch on GitHub so data keeps coming in while the PC is off?\n\nOK = start one, Cancel = do not');
    await post(`/api/lab/stop${cloud ? '?cloud=1' : ''}`);
  }
  setTimeout(poll, 600);
}

// ---- Rendering ----
function renderHeader() {
  const w = lab ? ['datagen', 'watchdog', 'cloud_sync', 'oracle_sync'] : [];
  const on = w.filter(k => lab[k]).length;
  const label = !lab ? '' : lab.busy ? (lab.busy === 'start' ? 'Starting…' : 'Stopping…') : on === w.length ? 'Lab running' : on === 0 ? 'Lab stopped' : `Lab partly running`;
  const dot = !lab ? 'stopped' : lab.busy || on === w.length ? 'running' : on === 0 ? 'stopped' : 'finished';
  setHtml($('#labstate'), lab ? `<span class="labstate" data-go="lab" title="Open the Lab tab"><span class="dot ${dot}"></span>${label}</span>` : '');
  const liveN = runs.filter(r => r.status === 'running').length;
  const unlocked = ach ? ach.items.filter(a => a.unlocked).length : 0;
  const alerts = health && (!health.updated || health.level !== 'ok' || health.now - health.updated > 30) ? 1 : 0;
  const badge = { tournaments: liveN ? `<span class="count">${liveN}</span>` : '', achievements: unlocked ? `<span class="count">${unlocked}</span>` : '', lab: alerts ? '<span class="count alert">!</span>' : '' };
  setHtml($('#tabs'), TABS.map(([k, n, ic]) => `<button data-go="${k}" class="${k === tab ? 'active' : ''}"><span class="ic">${ic}</span><span>${n}</span>${badge[k] || ''}</button>`).join(''));
}

let loaded = false;

function render() {
  const m = versionModel();
  renderHeader();
  if (!loaded) { setHtml($('#view'), '<div class="empty">Loading…</div>'); return; }
  const html = { overview: () => renderOverview(m), versions: () => renderVersions(m), championship: renderChampionship, tournaments: renderTournaments, achievements: () => renderAchievements(m), lab: renderLab }[tab]();
  setHtml($('#view'), html);
  document.title = (m.strongest ? `${m.strongest.perf.toFixed(0)} · ` : '') + 'Pawnstorm Lab';
}

let pollN = 0;
async function poll() {
  const j = async u => { try { return await (await fetch(u)).json(); } catch (e) { return undefined; } };
  const n = pollN++;
  try {
    const [h, l, t, s, g, r, rt, a, cat, pr] = await Promise.all([
      j('/api/health'), j('/api/lab'), j('/api/training'), j('/api/schedule'), j('/api/datagen'), j('/api/runs'),
      j('/api/ratings'), n % 5 === 0 || !ach ? j('/api/achievements') : Promise.resolve(undefined), j('/api/versions'), j('/api/prepare'),
    ]);
    if (r === undefined) throw new Error('unreachable');
    health = h ?? null; lab = l ?? null; schedule = s ?? null;
    trains = (t ?? []).sort((x, y) => y.started - x.started);
    gens = g ?? [];
    gens.forEach(trackRate);
    // Running generators first, then newest.
    gens.sort((x, y) => ((y.state === 'running') - (x.state === 'running')) || (y.started - x.started));
    runs = r;
    if (cat) setCatalog(cat);
    if (pr) { preps = pr; preps.forEach(trackPrep); }
    if (rt) ratings = rt;
    if (a) ach = a;
    const champ = latestChampionship();
    const want = runs.filter(x => x.status === 'running' || isOpen('run:' + x.id) || x === champ).map(x => x.id);
    const got = await Promise.all(want.map(id => j('/api/run/' + encodeURIComponent(id))));
    details = {};
    want.forEach((id, i) => { if (got[i]) details[id] = got[i]; });
    $('#updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    loaded = true;
    render();
  } catch (e) {
    $('#updated').innerHTML = '<span class="neg">Dashboard server not reachable</span>';
  }
}

render();
poll();
// No point polling while the tab is hidden (e.g. phone screen off); catch up as soon as it is shown.
setInterval(() => { if (!document.hidden) poll(); }, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
</body>
</html>

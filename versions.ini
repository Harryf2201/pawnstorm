[v1.3s]
title = Search upgrade
status = passed
became = v1.4
date = 2026-10-11
parent = v1.3
branch = next
network = 512 (v1.3's network)
data = 330M gen2 positions (v1.3's network)
summary = v1.3 plus two engine improvements: correction history (better use of the evaluation in the search) and hand-written AVX2 code for the network (5-8% faster). PASSED: +18.3 +/- 11.3 Elo vs v1.3 over 800 games (116 wins, 610 draws, 74 losses), test stopped once the whole 95% range was above zero. Merged into master as v1.4; its games are rated under v1.4.


summary = v1.3's network with a better search: correction history (learns per pawn structure how far off the evaluation tends to be) and a hand-written AVX2 network output (5-8% faster). Same engine as the v1.3s experiment, which beat v1.3 by +18 Elo over 800 games.

[v1.5]
title = Search upgrade 2
engines = pawnstorm-v1.5
status = main
date = 2026-10-11
parent = v1.4
branch = search2
network = 512 (v1.3's network)
data = 330M gen2 positions (v1.3's network)
summary = v1.4 plus four standard search improvements: smarter time use (less time when the best move is stable, more when the search keeps changing its mind), ProbCut (cut early when a good capture clearly wins), history pruning (skip quiet moves that keep failing) and fading the eval towards a draw as the 50-move rule approaches. Pawnstorm Championship 2 (stopped at ~800 games): beat v1.4 +39 +/- 38 head to head (+15 =60 -6); against Stockfish the pairings were too noisy (+/- 65) to separate it from v1.4. Real gain probably +15-25 (self-play inflates head-to-head gains).


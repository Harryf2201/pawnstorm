summary = Experiment: a network 2.5x bigger. It lost to v0.8 (41%): 30% slower to search and probably undertrained.

[v0.9b]
title = Output buckets
engines = pawnstorm-v0.9b-512x8
status = failed
date = 2026-10-10
parent = v0.8
branch = v0.9b
network = 512 with 8 material output buckets
data = 219M positions (same as v0.8)
summary = Experiment: v0.8's network size plus separate output weights for opening, middlegame and endgame material. Beat v0.8 58% in 50 games; the SPRT then showed it is not better: -8.5 +/- 14.9 Elo vs v0.8 over 978 games (stopped early). The 50-game win was luck.

[v0.9c]
title = Wide network, longer training
engines = pawnstorm-v0.9c-1024x8-long
status = failed
date = 2026-10-10
parent = v0.9a
branch = v0.9a
network = 1024 with 8 material output buckets
data = 219M positions (same as v0.8), trained 3x longer
summary = Experiment: v0.9a trained for 120 rounds instead of 40, to test whether it was just undertrained. FAILED: scored 35% vs v0.8 (6 wins, 23 draws, 21 losses) and 43% overall in 200 games. A bigger network needs far more data than 219M positions.

[v1.0]
title = Gen2 data, 50M
engines = pawnstorm-v1.0-50m
status = main
date = 2026-10-11
parent = v0.8
branch = master
network = 512 (same as v0.8)
data = 50M gen2 positions (v0.8's network playing itself)
summary = The first version trained on gen2 data (from this PC and the Oracle server). Rated about 3060: as strong as v0.8.1 with a sixth of the data (v0.5 had 40M gen1 positions and rated ~2865). Beat v0.8 60%, drew level with v0.8.1 (47%), SF-2900 68%, SF-3100 44%.


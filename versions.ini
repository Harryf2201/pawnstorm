[v0.8]
engines = pawnstorm-v0.8-219m
status = best
date = 2026-10-10
parent = v0.7
branch = master
network = 512
data = 219M positions (all hand-written-evaluation data)
summary = Trained on all 219M positions of the first data generation. Current strongest version, and the network that generates the gen2 data.

[v0.9a]
engines = pawnstorm-v0.9-1024x8
status = failed
date = 2026-10-10
parent = v0.8
branch = v0.9a
network = 1024 with 8 material output buckets
data = 219M positions (same as v0.8)
summary = Experiment: a network 2.5x bigger. It lost to v0.8 (41%): 30% slower to search and probably undertrained.

[v0.9b]
engines = pawnstorm-v0.9b-512x8
status = failed
date = 2026-10-10
parent = v0.8
branch = v0.9b
network = 512 with 8 material output buckets
data = 219M positions (same as v0.8)
summary = Experiment: v0.8's network size plus separate output weights for opening, middlegame and endgame material. Beat v0.8 58% in 50 games; the SPRT then showed it is not better: -8.5 +/- 14.9 Elo vs v0.8 over 978 games (stopped early). The 50-game win was luck.

[v0.9c]
engines = pawnstorm-v0.9c-1024x8-long
status = testing
date = 2026-10-10
parent = v0.9a
branch = v0.9a
network = 1024 with 8 material output buckets
data = 219M positions (same as v0.8), trained 3x longer
summary = Experiment: v0.9a trained for 120 rounds instead of 40, to test whether it was just undertrained.

[v1.0]
engines = pawnstorm-v1.0
status = planned
parent = v0.8
branch = master
network = the winner of the v0.9 experiments
data = gen2: positions generated by v0.8's own network
summary = Planned: the first version trained on data from a neural-network engine instead of the hand-written evaluation.

[v0.8.1]
engines = pawnstorm-v0.8.1
status = testing
date = 2026-10-10
parent = v0.8
branch = master
network = 512 (same as v0.8)
data = ~292M gen1 positions (v0.8's 219M plus the last classical cloud batch)
summary = v0.8's exact recipe with about a third more data, while gen2 data builds up for v1.0.

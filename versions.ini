summary = Mixing the old gen1 data in made it weaker than v1.2 alone: rated about 3116 (v0.8.1 67%, v1.1 66%, SF-2900 77%, SF-3100 43%). From now on, gen1 data is left out.

[v1.2k]
title = King buckets
engines = pawnstorm-v1.2k-260m
status = failed
date = 2026-10-11
parent = v1.2
branch = kb
network = 512 with 10 mirrored king buckets in the inputs
data = 260M gen2 positions (same amount as v1.2)
summary = Experiment: v1.2's recipe, but the network's first layer has separate weights depending on where each side's king stands (the standard approach in top engines). Not better yet: rated about 3065, scoring 46% against v1.2 (11 wins, 24 draws, 15 losses), SF-3100 46%. Ten buckets probably split 260M positions too thinly; worth retrying with fewer buckets, longer training or more (gen3) data.

[v1.2c]
title = Correction history
engines = pawnstorm-corrhist-v12
status = testing
date = 2026-10-11
parent = v1.2
branch = corrhist
network = 512 (v1.2's network)
data = 260M gen2 positions (v1.2's network)
summary = Search experiment: the search learns, for each pawn structure, how far off the network's evaluation tends to be and corrects for it. +33 ±31 Elo over v1.2 in 158 games (stopped early): promising, confirmed together with the AVX2 speed-up as v1.3s.

[v1.3]
title = Gen2, 330M
engines = pawnstorm-v1.3-330m, pawnstorm-base-v13
status = best
date = 2026-10-11
parent = v0.8
branch = master
network = 512 (same as v0.8)
data = all gen2 available at 14:30 Oct 11 (~400M expected)
summary = Same recipe as v1.2 with more gen2 data. Beat v1.2 54% (+9 =36 -5), v1.1 65%, v0.8.1 75%, SF-3100 51%; rated about 3136, level with v1.2. Its network generates the gen3 data.

[v1.3s]
title = Search upgrade
engines = pawnstorm-next1-v13
status = testing
date = 2026-10-11
parent = v1.3
branch = next
network = 512 (v1.3's network)
data = 330M gen2 positions (v1.3's network)
summary = v1.3 plus two engine improvements: correction history (better use of the evaluation in the search) and hand-written AVX2 code for the network (5-8% faster). If its test passes, it becomes the new main engine.

[v1.3w]
title = Wide network
engines = pawnstorm-v1.3w
status = testing
date = 2026-10-11
parent = v1.3
branch = master
network = 1024 (twice v1.3's width)
data = 330M gen2 positions, 60 training rounds
summary = Retrying the bigger network now that there is far more and better data (it failed as v0.9a/v0.9c on the old data). Trained (60 rounds) and built (branch wide); tested against v1.3 after the v1.3s test.

summary = Retrying the bigger network now that there is far more and better data (it failed as v0.9a/v0.9c on the old data). Trained (60 rounds) and built (branch wide); tested against v1.3 (same old search). Shelved at 178 games (+11.7 +/- 29.6 Elo, not clear) to save compute. Gets another try once there is far more (gen3) data, when a bigger network should pay off more.

[v1.4]

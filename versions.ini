status = main
date = 2026-10-11
parent = v0.8
branch = master
network = 512 (same as v0.8)
data = 100M gen2 positions (or all available at ~03:45)
summary = 100M gen2 positions. First 200 games: beat v0.8 64% and v0.8.1 63%, SF-2900 72%, but only 30% against SF-3100 (v1.0 got 44%). In Pawnstorm Championship 1 (1241 games, stopped early) it rated 3031 ±45, level with v0.8.1 (3027) and v1.0 (3008).

[v1.2]

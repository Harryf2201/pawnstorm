; Pawnstorm version catalog: one section per engine version, newest last.
; The dashboard reads this for friendly names and the Versions page.
;   engines  = names the version has used in tournaments/PGNs (comma separated). They are all the
;              same engine; ratings should merge them.
;   status   = main (a released step on the main line), best (the current strongest main version),
;              testing, passed (experiment kept), failed (experiment dropped), planned
;   parent   = version it was compared against / built from
;   branch   = git branch (or "master")
; Ratings are not stored here; the dashboard computes them live from all games.

[v0.1]
engines = Pawnstorm-0.1, pawnstorm-v0.1
status = main
date = 2026-10-10
branch = master
network = none (hand-written evaluation: PeSTO piece-square tables)
data = none
summary = The first engine: bitboard move generation, alpha-beta search with modern pruning, and a hand-written evaluation.

[v0.2]
engines = pawnstorm-v0.2
status = main
date = 2026-10-10
parent = v0.1
branch = master
network = 512 (first neural network)
data = 2.4M positions
summary = First neural network, trained on far too little data. Weaker than v0.1, which showed how much data matters.

[v0.3]
engines = pawnstorm-v0.3-10m
status = main
date = 2026-10-10
parent = v0.2
branch = master
network = 512
data = 10M positions
summary = Network trained on 10M self-play positions. Matched v0.1.

[v0.4]
engines = pawnstorm-v0.4-20m
status = main
date = 2026-10-10
parent = v0.3
branch = master
network = 512
data = 20M positions
summary = Twice the data of v0.3 (about +100 Elo).


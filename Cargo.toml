[package]
name = "pawnstorm"
version = "2.0.0"
edition = "2021"

[features]
# Architecture selection; default preserves the targeted worktree baseline.
nnue1024 = []

[dependencies]
shakmaty = "0.30.2"
shakmaty-syzygy = "0.28.1"

[workspace]
members = [".", "tools/dashboard", "tools/openings", "tools/attack-seeds"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
